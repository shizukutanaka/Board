<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#00C4CC">
<meta name="description" content="Board — offline-first infinite whiteboard. zero install, zero signup, zero ads.">
<title>Board</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"Board","short_name":"Board","start_url":".","display":"standalone","background_color":"%23ffffff","theme_color":"%2300C4CC","icons":[{"src":"data:image/svg+xml;utf8,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 192 192%27%3E%3Crect width=%27192%27 height=%27192%27 rx=%2740%27 fill=%27%2300C4CC%27/%3E%3Cpath d=%27M48 64h96v64H48z%27 fill=%27none%27 stroke=%27white%27 stroke-width=%276%27/%3E%3C/svg%3E","sizes":"192x192","type":"image/svg+xml"}]}'>
<style>
/* ================================================================
   Board v1.6.43 — Design Tokens
   Palette: #00C4CC base, WCAG AAA contrast.
   Typography: OS-native high-quality stack, no AI-cliché fonts.
   ================================================================ */
:root{
  --brand:#00C4CC;
  --brand-ink:#003B40;      /* text on brand: 7.5:1 contrast AAA */
  --brand-deep:#008A91;     /* hover/active */
  --brand-soft:#E6F9FA;     /* tint bg */
  --ink:#0F172A;            /* primary text 18:1 on white AAA */
  --ink-2:#334155;          /* secondary 10:1 AAA */
  --ink-3:#64748B;          /* tertiary 4.7:1 AA */
  --paper:#FFFFFF;
  --mist:#F8FAFC;
  --mist-2:#F1F5F9;
  --line:#E2E8F0;
  --line-2:#CBD5E1;
  --danger:#B91C1C;
  --warn:#B45309;
  --ok:#15803D;
  --shadow-sm:0 1px 2px rgba(15,23,42,.06),0 1px 1px rgba(15,23,42,.04);
  --shadow-md:0 4px 12px rgba(15,23,42,.08),0 2px 4px rgba(15,23,42,.04);
  --shadow-lg:0 12px 32px rgba(15,23,42,.14),0 4px 8px rgba(15,23,42,.06);
  --radius-sm:6px;
  --radius:10px;
  --radius-lg:14px;
  --gap:10px;
  --pad:10px;
  --ui-font:"Hiragino Sans","Helvetica Neue","Segoe UI",system-ui,sans-serif;
  --mono-font:"SF Mono","JetBrains Mono","Menlo","Consolas",monospace;
  --dur:180ms;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#0B1220; --mist:#0F172A; --mist-2:#1E293B;
    --ink:#F1F5F9; --ink-2:#CBD5E1; --ink-3:#94A3B8;
    --line:#1E293B; --line-2:#334155;
    --brand-soft:#003B40;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow-md:0 4px 12px rgba(0,0,0,.5);
    --shadow-lg:0 12px 32px rgba(0,0,0,.6);
  }
}
:root[data-theme=light]{
  --paper:#FFFFFF;--mist:#F8FAFC;--mist-2:#F1F5F9;
  --ink:#0F172A;--ink-2:#334155;--ink-3:#64748B;
  --line:#E2E8F0;--line-2:#CBD5E1;--brand-soft:#E6F9FA;
}
:root[data-theme=dark]{
  --paper:#0B1220;--mist:#0F172A;--mist-2:#1E293B;
  --ink:#F1F5F9;--ink-2:#CBD5E1;--ink-3:#94A3B8;
  --line:#1E293B;--line-2:#334155;--brand-soft:#003B40;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:var(--ui-font);
  color:var(--ink); background:var(--mist);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}

/* ---- App shell ---- */
#app{
  position:fixed;inset:0;
  display:grid;
  grid-template-rows:auto 1fr auto;
  grid-template-columns:auto 1fr;
  grid-template-areas:
    "tools top"
    "tools canvas"
    "tools status";
}
.topbar{
  grid-area:top;
  display:flex;align-items:center;gap:var(--gap);
  padding:var(--pad) 14px;
  background:var(--paper);
  border-bottom:1px solid var(--line);
  z-index:10;
  min-height:44px;
}
.brand{
  display:flex;align-items:center;gap:8px;
  font-weight:600;font-size:14px;letter-spacing:.02em;
  color:var(--ink);
  padding-right:12px;margin-right:4px;
  border-right:1px solid var(--line);
}
.brand svg{width:20px;height:20px;display:block}
.brand-dot{color:var(--brand)}

.doc-name{
  font-size:13px;color:var(--ink-2);
  padding:6px 10px;border-radius:var(--radius-sm);
  cursor:text;
  max-width:220px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.doc-name:hover{background:var(--mist-2)}
.doc-name:focus{outline:2px solid var(--brand);outline-offset:1px;background:var(--paper)}

.top-spacer{flex:1}

.btn{
  display:inline-flex;align-items:center;gap:6px;
  height:32px;padding:0 12px;
  border-radius:var(--radius-sm);
  font-size:13px;font-weight:500;
  color:var(--ink-2);
  background:transparent;
  transition:background var(--dur) var(--ease), color var(--dur) var(--ease);
  white-space:nowrap;
}
.btn:hover{background:var(--mist-2);color:var(--ink)}
.btn:active{background:var(--line)}
.btn:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.btn.primary{background:var(--brand);color:var(--brand-ink);font-weight:600}
.btn.primary:hover{background:var(--brand-deep);color:#fff}
.btn.icon{width:32px;padding:0;justify-content:center}
.btn svg{width:16px;height:16px;display:block;flex-shrink:0}
.btn[aria-pressed=true]{background:var(--brand-soft);color:var(--brand-ink)}
.btn[disabled]{opacity:.4;cursor:not-allowed}

.sep{width:1px;height:20px;background:var(--line);margin:0 2px}

/* ---- Toolbar (left) ---- */
.toolbar{
  grid-area:tools;
  display:flex;flex-direction:column;
  gap:4px;padding:var(--pad) 8px;
  background:var(--paper);
  border-right:1px solid var(--line);
  z-index:10;
  width:52px;
}
.tool{
  width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;
  border-radius:var(--radius-sm);
  color:var(--ink-2);
  transition:background var(--dur) var(--ease), color var(--dur) var(--ease);
  position:relative;
}
.tool:hover{background:var(--mist-2);color:var(--ink)}
.tool[aria-pressed=true]{background:var(--brand);color:var(--brand-ink)}
.tool:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.tool svg{width:18px;height:18px}
.tool kbd{
  position:absolute;bottom:2px;right:3px;
  font-family:var(--mono-font);font-size:9px;
  color:var(--ink-3);line-height:1;pointer-events:none;
}
.tool[aria-pressed=true] kbd{color:var(--brand-ink);opacity:.7}
.tool-sep{height:1px;background:var(--line);margin:4px 4px}

/* ---- Canvas ---- */
.canvas-wrap{
  grid-area:canvas;
  position:relative;
  background:var(--mist);
  overflow:hidden;
}
canvas#c{
  position:absolute;inset:0;
  width:100%;height:100%;
  display:block;
  cursor:crosshair;
  touch-action:none;
}
canvas#c[data-tool=select]{cursor:default}
canvas#c[data-tool=hand]{cursor:grab}
canvas#c[data-panning=true]{cursor:grabbing}
canvas#c[data-tool=text]{cursor:text}
canvas#c[data-tool=eraser]{cursor:crosshair}

/* Floating style panel */
.style-panel{
  position:absolute;
  top:var(--pad);left:var(--pad);
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:8px;
  display:flex;align-items:center;gap:8px;
  box-shadow:var(--shadow-md);
  z-index:5;
  transition:opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.style-panel[hidden]{display:flex!important;opacity:0;transform:translateY(-8px);pointer-events:none}
.sp-group{display:flex;align-items:center;gap:4px}
.sp-label{font-size:11px;color:var(--ink-3);font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.swatch{
  width:22px;height:22px;
  border-radius:50%;
  border:2px solid transparent;
  cursor:pointer;
  transition:transform var(--dur) var(--ease);
  position:relative;
}
.swatch:hover{transform:scale(1.1)}
.swatch[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 2px var(--paper) inset}
.dashbtn{width:26px;height:22px;padding:0;border:1.5px solid var(--line-2);border-radius:5px;
  background:var(--paper);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
.dashbtn:hover{border-color:var(--ink-3)}
.dashbtn[aria-pressed=true]{border-color:var(--brand-ink);box-shadow:0 0 0 1px var(--brand-ink) inset}
.swatch.cp{padding:1px}
.swatch.null{background:
  linear-gradient(45deg,transparent 45%,var(--danger) 45%,var(--danger) 55%,transparent 55%),
  var(--paper);
  border-color:var(--line-2);
}
.range{
  -webkit-appearance:none;appearance:none;
  width:80px;height:3px;
  background:var(--line);
  border-radius:2px;
  cursor:pointer;
}
.range::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:14px;height:14px;border-radius:50%;
  background:var(--brand);border:2px solid var(--paper);
  box-shadow:var(--shadow-sm);cursor:pointer;
}
.range::-moz-range-thumb{
  width:14px;height:14px;border-radius:50%;
  background:var(--brand);border:2px solid var(--paper);
  box-shadow:var(--shadow-sm);cursor:pointer;border:none;
}
.sp-val{font:500 11px/1 var(--mono-font);color:var(--ink-3);min-width:24px;text-align:right}

/* Zoom badge */
.zoom-badge{
  position:absolute;bottom:var(--pad);right:var(--pad);
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  padding:4px;
  display:flex;align-items:center;gap:2px;
  box-shadow:var(--shadow-sm);
  z-index:5;
}
.zoom-badge button{
  width:28px;height:28px;
  border-radius:var(--radius-sm);
  color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;
}
.zoom-badge button:hover{background:var(--mist-2);color:var(--ink)}
.zoom-val{
  font:500 12px/1 var(--mono-font);
  color:var(--ink-2);
  padding:0 8px;min-width:52px;text-align:center;
  border-radius:var(--radius-sm);
  height:28px;display:flex;align-items:center;justify-content:center;
}
.zoom-val:hover{background:var(--mist-2)}

/* Status bar */
.statusbar{
  grid-area:status;
  display:flex;align-items:center;gap:16px;
  padding:6px 14px;
  background:var(--paper);
  border-top:1px solid var(--line);
  font:500 11px/1 var(--mono-font);
  color:var(--ink-3);
  height:28px;
  z-index:10;
}
.status-item{display:flex;gap:4px;align-items:center}
.status-item .lbl{color:var(--ink-3);opacity:.7}
.status-spacer{flex:1}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.status-dot.offline{background:var(--ink-3)}

/* Text input overlay */
.text-overlay{
  position:absolute;
  outline:2px solid var(--brand);outline-offset:2px;
  background:transparent;border:0;padding:0;
  resize:none;overflow:hidden;
  line-height:1.25;
  z-index:6;
  box-shadow:0 0 0 4px rgba(0,196,204,.12);
  font-family:var(--ui-font);
}
.text-overlay:focus{outline:2px solid var(--brand)}

/* Minimap */
.minimap-wrap{
  position:fixed;bottom:36px;right:12px;
  width:160px;height:100px;
  border:1px solid var(--ln);border-radius:6px;
  background:var(--paper);box-shadow:0 2px 8px rgba(0,0,0,.12);
  overflow:hidden;cursor:pointer;z-index:200;
  opacity:.85;transition:opacity .2s;
}
.minimap-wrap:hover{opacity:1}
#minimap{display:block;width:100%;height:100%}

/* Help overlay */
.help-overlay{
  position:fixed;inset:0;
  background:rgba(15,23,42,.5);
  display:none;
  align-items:center;justify-content:center;
  z-index:100;
  padding:20px;
  backdrop-filter:blur(4px);
}
.help-overlay[data-open=true]{display:flex}
.help-card{
  background:var(--paper);
  border-radius:var(--radius-lg);
  padding:28px 32px;
  max-width:560px;width:100%;
  max-height:82vh;overflow:auto;
  box-shadow:var(--shadow-lg);
}
.help-card h2{font-size:20px;font-weight:600;margin-bottom:4px;color:var(--ink)}
.help-card .sub{font-size:13px;color:var(--ink-3);margin-bottom:20px}
.help-grid{
  display:grid;grid-template-columns:1fr 1fr;
  gap:4px 20px;
}
.help-row{
  display:flex;align-items:center;gap:10px;
  padding:6px 0;
  font-size:13px;
  border-bottom:1px solid var(--line);
}
.help-row:last-child,.help-row:nth-last-child(2){border-bottom:0}
.help-row .k{
  font-family:var(--mono-font);font-size:11px;
  background:var(--mist-2);padding:3px 7px;
  border-radius:4px;color:var(--ink);
  border:1px solid var(--line);
  min-width:56px;text-align:center;
  flex-shrink:0;
}
.help-row .v{color:var(--ink-2);flex:1}
.help-close{
  position:absolute;top:14px;right:14px;
  width:32px;height:32px;
  display:flex;align-items:center;justify-content:center;
  color:var(--ink-3);border-radius:var(--radius-sm);
}
.help-close:hover{background:var(--mist-2);color:var(--ink)}

/* Toast */
.toast-stack{
  position:fixed;bottom:44px;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;gap:6px;
  z-index:200;pointer-events:none;
}
.toast{
  background:var(--ink);color:var(--paper);
  padding:8px 16px;border-radius:999px;
  font-size:12px;font-weight:500;
  box-shadow:var(--shadow-lg);
  animation:tin var(--dur) var(--ease);
  pointer-events:auto;
}
.toast.ok{background:var(--ok);color:#fff}
.toast.warn{background:var(--warn);color:#fff}
.toast.err{background:var(--danger);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Context menu */
.ctx-menu{
  position:fixed;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow-lg);
  padding:4px;min-width:180px;
  z-index:50;
  display:none;
}
.ctx-menu[data-open=true]{display:block}
.ctx-item{
  display:flex;align-items:center;gap:10px;
  padding:7px 10px;
  border-radius:var(--radius-sm);
  font-size:13px;color:var(--ink);
  cursor:pointer;
  width:100%;
}
.ctx-item:hover{background:var(--mist-2)}
.ctx-item .k{font-family:var(--mono-font);font-size:10px;color:var(--ink-3);margin-left:auto}
.ctx-sep{height:1px;background:var(--line);margin:4px 4px}

/* Peer presence avatars */
.peer-stack{display:flex;align-items:center;gap:-4px;padding-right:6px}
.peer-stack:empty{display:none}
.peer-avatar{
  width:22px;height:22px;border-radius:50%;
  border:2px solid var(--paper);
  margin-left:-6px;
  display:flex;align-items:center;justify-content:center;
  font:600 9px/1 var(--mono-font);color:#fff;
  box-shadow:var(--shadow-sm);
}
.peer-avatar:first-child{margin-left:0}
.peer-avatar.self{background:var(--ink-3)}

/* Share modal extras */
.share-row{display:flex;gap:8px;margin-bottom:8px}
.share-input{
  flex:1;height:34px;padding:0 10px;
  background:var(--mist-2);border:1px solid var(--line);
  border-radius:var(--radius-sm);
  font:500 12px/1.4 var(--mono-font);color:var(--ink-2);
}
.share-input:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:var(--brand)}
.share-details{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.share-details summary{
  cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-2);
  padding:6px 4px;border-radius:var(--radius-sm);
  list-style:none;display:flex;align-items:center;gap:8px;
}
.share-details summary::-webkit-details-marker{display:none}
.share-details summary::before{content:'›';transition:transform var(--dur) var(--ease);font-size:18px;color:var(--ink-3)}
.share-details[open] summary::before{transform:rotate(90deg)}
.share-details summary:hover{background:var(--mist-2)}
.share-step{font-size:11px;color:var(--ink-3);font-weight:600;margin:12px 0 4px;
  text-transform:uppercase;letter-spacing:.04em}
.share-code{
  width:100%;
  padding:8px;background:var(--mist-2);
  border:1px solid var(--line);border-radius:var(--radius-sm);
  font:500 10px/1.4 var(--mono-font);color:var(--ink-2);
  resize:vertical;min-height:50px;
  margin:6px 0;
  word-break:break-all;
}
.share-code:focus{outline:2px solid var(--brand);outline-offset:1px}


@media (max-width:720px){
  .topbar{padding:6px 8px;gap:4px}
  .doc-name{max-width:100px;font-size:12px}
  .toolbar{width:44px;padding:6px 4px}
  .tool{width:36px;height:36px}
  .brand span{display:none}
  .topbar .btn span:not(.k){display:none}
  .statusbar{padding:4px 10px;gap:8px;font-size:10px}
  .status-item.optional{display:none}
  .help-grid{grid-template-columns:1fr}
}

/* Accessibility */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:0.01ms!important;transition-duration:0.01ms!important}
}
/* High-contrast / forced-colors (Windows High Contrast Mode) */
@media (forced-colors:active){
  .btn,.tool,.swatch,.dashbtn{border:1px solid ButtonText}
  .tool[aria-pressed=true]{outline:2px solid Highlight}
  .toast{border:1px solid CanvasText}
}
@media (prefers-contrast:more){
  :root{--line:#000;--ink:#000}
  :root[data-theme=dark]{--line:#fff;--ink:#fff}
}
:focus-visible{outline-offset:2px}

/* Hide to prevent FOUC before JS */
body{visibility:visible}

</style>
</head>

<div id="app">

  <!-- ==== Toolbar (left rail) ==== -->
  <nav class="toolbar" role="toolbar" aria-label="Tools">
    <button class="tool" data-tool="select" aria-pressed="true" aria-label="Select" title="Select (V)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/></svg>
      <kbd>V</kbd>
    </button>
    <button class="tool" data-tool="hand" aria-label="Pan" title="Pan (H / Space)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 10-4 0v5m-4-1V4a2 2 0 00-4 0v10M6 10V7a2 2 0 00-4 0v9a6 6 0 006 6h4a6 6 0 006-6v-3a2 2 0 00-4 0"/></svg>
      <kbd>H</kbd>
    </button>
    <div class="tool-sep"></div>
    <button class="tool" data-tool="pen" aria-label="Pen" title="Pen (P)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3zM18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5zM2 2l7.586 7.586M11 11a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
      <kbd>P</kbd>
    </button>
    <button class="tool" data-tool="rect" aria-label="Rectangle" title="Rectangle (R)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/></svg>
      <kbd>R</kbd>
    </button>
    <button class="tool" data-tool="ellipse" aria-label="Ellipse" title="Ellipse (O)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="12" rx="9" ry="7"/></svg>
      <kbd>O</kbd>
    </button>
    <button class="tool" data-tool="arrow" aria-label="Arrow" title="Arrow (A)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      <kbd>A</kbd>
    </button>
    <button class="tool" data-tool="line" aria-label="Line" title="Line (L)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20L20 4"/></svg>
      <kbd>L</kbd>
    </button>
    <button class="tool" data-tool="text" aria-label="Text" title="Text (T)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V5h16v2M9 19h6M12 5v14"/></svg>
      <kbd>T</kbd>

  c.setLineDash((s.dash&&(s.type==='rect'||s.type==='ellipse'||s.type==='line'||s.type==='arrow'))?dashArr(s.dash,s.size):[]);
  if(s.fill){c.fillStyle=s.fill}
  const _rot=s.rotate;
  if(_rot){const _cx=s.x+(s.w||0)/2,_cy=s.y+(s.h||0)/2;c.save();c.translate(_cx,_cy);c.rotate(_rot*Math.PI/180);c.translate(-_cx,-_cy);}
  switch(s.type){
    case 'rect':
      c.beginPath();
      roundRect(c,s.x,s.y,s.w,s.h,Math.min(8,Math.abs(s.w)/4,Math.abs(s.h)/4));
      if(s.fill){c.fill()}
      if(s.stroke){c.stroke()}break;
    case 'ellipse':
      c.beginPath();
      c.ellipse(s.x+s.w/2,s.y+s.h/2,Math.abs(s.w/2),Math.abs(s.h/2),0,0,PI2);
      if(s.fill){c.fill()}
      if(s.stroke){c.stroke()}break;
    case 'line':{
      const e=connEnds(s);c.beginPath();c.moveTo(e.x1,e.y1);c.lineTo(e.x2,e.y2);c.stroke();break;}
    case 'arrow':
      drawArrow(s,c);break;
    case 'pen':
      drawPen(s,c);break;
    case 'text':
      drawText(s,c);break;
    case 'image':{
      const img=getImg(s.dataUrl);
      if(img.complete&&img.naturalWidth)c.drawImage(img,s.x,s.y,s.w,s.h);
      else{c.strokeStyle=s.stroke||'#CBD5E1';c.lineWidth=1;c.strokeRect(s.x,s.y,s.w,s.h)}
      break;}
    case 'frame':{
      // Frame: thin labeled border, transparent so content shows through
      const r=4;
      c.save();
      c.globalAlpha=(s.opacity??1)*0.9;
      // subtle fill
      c.fillStyle='rgba(248,250,252,0.6)';
      c.beginPath();roundRect(c,s.x,s.y,s.w,s.h,r);c.fill();
      // border
      c.strokeStyle=s.stroke||getCSS('--brand')||'#00C4CC';
      c.lineWidth=s.size||1.5;
      c.setLineDash([]);
      c.beginPath();roundRect(c,s.x,s.y,s.w,s.h,r);c.stroke();
      // label
      const lbl=s.label||'Frame';
      const fs=12;
      c.fillStyle=s.stroke||getCSS('--brand')||'#00C4CC';
      c.font=`600 ${fs}px system-ui,sans-serif`;
      c.textBaseline='bottom';
      c.fillText(lbl,s.x+6,s.y-2);
      c.restore();
      break;}
    case 'sticky':{
      const r=Math.min(6,Math.abs(s.w)/6,Math.abs(s.h)/6);
      c.fillStyle=s.color||'#FEF08A';
      c.beginPath();roundRect(c,s.x,s.y,s.w,s.h,r);c.fill();
      c.shadowColor='rgba(0,0,0,.08)';c.shadowBlur=8;c.shadowOffsetY=2;
      c.strokeStyle='rgba(0,0,0,.06)';c.lineWidth=1;c.stroke();
      c.shadowColor='transparent';c.shadowBlur=0;c.shadowOffsetY=0;
      // text
      if(s.text){
        const fs=s.fontSize||14;
        c.fillStyle='#1E293B';c.font=`${fs}px Hiragino Sans,Helvetica Neue,system-ui,sans-serif`;
        c.textBaseline='top';
        const lh=fs*1.3, pad=8;
        const lines=wrapText(s.text,Math.abs(s.w)-pad*2,t=>c.measureText(t).width);
        c.save();c.beginPath();roundRect(c,s.x,s.y,s.w,s.h,r);c.clip();
        for(let i=0;i<lines.length;i++)c.fillText(lines[i],s.x+pad,s.y+pad+i*lh);
        c.restore();
      }
      break;}
  }
  if((s.type==='rect'||s.type==='ellipse')&&s.label){
    const cx=s.x+s.w/2,cy=s.y+s.h/2;
    c.font='14px system-ui,sans-serif';c.textBaseline='middle';c.textAlign='center';
    c.fillStyle=s.stroke||'#0F172A';c.fillText(s.label,cx,cy);
    c.textBaseline='alphabetic';c.textAlign='left';
  }
  c.globalAlpha=1;
  c.setLineDash([]);
  if(_rot)c.restore();
}
// Dash pattern (world units, scaled by stroke size). dash: 1=dashed, 2=dotted.
function dashArr(dash,size){const s=Math.max(1,size||1);return dash===2?[s*0.5,s*2]:dash===1?[s*3,s*2.5]:[]}
function roundRect(c,x,y,w,h,r){
  if(w<0){x+=w;w=-w}if(h<0){y+=h;h=-h}
  r=Math.max(0,Math.min(r,w/2,h/2));
  c.moveTo(x+r,y);
  c.lineTo(x+w-r,y);c.arcTo(x+w,y,x+w,y+r,r);
  c.lineTo(x+w,y+h-r);c.arcTo(x+w,y+h,x+w-r,y+h,r);
  c.lineTo(x+r,y+h);c.arcTo(x,y+h,x,y+h-r,r);
  c.lineTo(x,y+r);c.arcTo(x,y,x+r,y,r);
  c.closePath();
}
function drawArrow(s,c){
  c=c||ctx;
  const e=connEnds(s);
  c.beginPath();c.moveTo(e.x1,e.y1);c.lineTo(e.x2,e.y2);c.stroke();
  const ah=Math.max(6,(s.size||2)*3);
  const ang=Math.atan2(e.y2-e.y1,e.x2-e.x1);
  const a1=ang+Math.PI-0.5,a2=ang+Math.PI+0.5;
  c.beginPath();
  c.moveTo(e.x2,e.y2);
  c.lineTo(e.x2+Math.cos(a1)*ah,e.y2+Math.sin(a1)*ah);
  c.lineTo(e.x2+Math.cos(a2)*ah,e.y2+Math.sin(a2)*ah);
  c.closePath();c.fillStyle=s.stroke||'#0F172A';c.fill();
}
// Variable stroke width from spacing (velocity proxy); render-only, no model change.
function penWidths(pts,size){
  const n=pts.length,base=Math.max(0.5,size||2),REF=base*3+8,LO=0.45;
  // Use varying pointer pressure if available; fall back to velocity proxy.
  let hasPr=true,mn=Infinity,mx=-Infinity;
  for(let i=0;i<n;i++){const pr=pts[i][2];if(!Number.isFinite(pr)){hasPr=false;break}if(pr<mn)mn=pr;if(pr>mx)mx=pr}
  const usePr=hasPr&&(mx-mn)>0.05,PLO=0.35;
  const raw=new Array(n);
  for(let i=0;i<n;i++){
    if(usePr){
      raw[i]=base*Math.max(LO,Math.min(1,PLO+(1-PLO)*pts[i][2]));
    }else{
      let d=0,c=0;
      if(i>0){d+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);c++}
      if(i<n-1){d+=Math.hypot(pts[i+1][0]-pts[i][0],pts[i+1][1]-pts[i][1]);c++}
      const sp=c?d/c:0,t=Math.min(1,sp/REF);
      raw[i]=base*(1-(1-LO)*t);
    }
  }
  // 3-tap smooth so width doesn't jitter between samples
  const w=new Array(n);
  for(let i=0;i<n;i++)w[i]=(raw[Math.max(0,i-1)]+raw[i]+raw[Math.min(n-1,i+1)])/3;
  return w;
}
function drawPen(s,c){
  c=c||ctx;
  const p=s.pts,n=p.length;
  if(n<2){
    c.fillStyle=s.stroke;
    c.beginPath();c.arc(p[0][0],p[0][1],(s.size||2)/2,0,PI2);c.fill();
    return;
  }
  // Variable-width ink: per-segment lineWidth; round caps blend them.
  const w=penWidths(p,s.size),oldCap=c.lineCap,oldJoin=c.lineJoin,oldW=c.lineWidth;
  c.strokeStyle=s.stroke;c.lineCap='round';c.lineJoin='round';
  let px=p[0][0],py=p[0][1];
  for(let i=1;i<n-1;i++){
    const mx=(p[i][0]+p[i+1][0])/2,my=(p[i][1]+p[i+1][1])/2;
    c.lineWidth=(w[i]+w[i+1])/2;
    c.beginPath();c.moveTo(px,py);c.quadraticCurveTo(p[i][0],p[i][1],mx,my);c.stroke();
    px=mx;py=my;
  }
  c.lineWidth=(w[n-2]+w[n-1])/2;
  c.beginPath();c.moveTo(px,py);c.lineTo(p[n-1][0],p[n-1][1]);c.stroke();
  c.lineCap=oldCap;c.lineJoin=oldJoin;c.lineWidth=oldW;
}
function drawText(s,c){
  c=c||ctx;
  if(s.id===state.editing)return;
  c.fillStyle=s.stroke||'#0F172A';
  const fs=s.fontSize||16;
  c.font=`${fs}px ${'Hiragino Sans,Helvetica Neue,system-ui,sans-serif'}`;
  c.textBaseline='top';
  const lines=(s.text||'').split('\n');
  const lh=fs*1.25;
  for(let i=0;i<lines.length;i++)c.fillText(lines[i],s.x,s.y+i*lh);
}

// World-space resize handles: nw/n/ne/e/se/s/sw/w for boxes; p1/p2 for lines.
function getHandles(s){
  if(s.locked||s.rotate)return [];
  if(s.type==='line'||s.type==='arrow'){
    const e=connEnds(s),h=[];   // bound endpoints follow their shape, so no drag handle
    if(!s.a)h.push({id:'p1',x:e.x1,y:e.y1});
    if(!s.b)h.push({id:'p2',x:e.x2,y:e.y2});
    return h;
  }
  if(s.type==='pen')return []; // pen geometry lives in pts; box-resize would NaN it. Move-only.
  const b=G.bbox(s);
  const{x,y,w,h}=b;
  return[
    {id:'nw',x,y},{id:'n',x:x+w/2,y},{id:'ne',x:x+w,y},
    {id:'w',x,y:y+h/2},                {id:'e',x:x+w,y:y+h/2},
    {id:'sw',x,y:y+h},{id:'s',x:x+w/2,y:y+h},{id:'se',x:x+w,y:y+h}
  ];
}
function hitHandle(wp,s){
  const tol=HANDLE_SIZE/state.viewport.zoom;
  for(const h of getHandles(s)){
    if(Math.abs(wp.x-h.x)<=tol&&Math.abs(wp.y-h.y)<=tol)return h.id;
  }
  return null;
}
// Object-snap for resize: snap the dragged handle's moving edge(s) to nearby shape
// edges/centres. Only the coordinates the handle actually moves are snapped. Pure-ish
// (reads state.shapes/viewport). Mirrors move's objectSnap; active only when grid-snap
// is off. Rotated shapes are skipped (axis-aligned edge snap would be incoherent).
function resizeSnap(orig,handle,wp){
  if(state.snap||orig.rotate||handle==='p1'||handle==='p2')return{x:wp.x,y:wp.y,guides:[]};
  const tol=SNAP_OBJ/state.viewport.zoom;
  const movesX=/[ew]/.test(handle),movesY=/[ns]/.test(handle);
  let x=wp.x,y=wp.y;const guides=[],targets=[];
  for(const s of state.shapes){if(s.id===orig.id)continue;const b=G.bbox(s);if(b)targets.push(b)}
  if(movesX){let best=null;for(const b of targets)for(const t of[b.x,b.x+b.w/2,b.x+b.w]){const d=t-wp.x;if(Math.abs(d)<=tol&&(!best||Math.abs(d)<Math.abs(best.d)))best={d,at:t,b};}
    if(best){x=best.at;const ys=[orig.y,orig.y+orig.h,best.b.y,best.b.y+best.b.h];guides.push({x1:best.at,y1:Math.min(...ys),x2:best.at,y2:Math.max(...ys)});}}
  if(movesY){let best=null;for(const b of targets)for(const t of[b.y,b.y+b.h/2,b.y+b.h]){const d=t-wp.y;if(Math.abs(d)<=tol&&(!best||Math.abs(d)<Math.abs(best.d)))best={d,at:t,b};}
    if(best){y=best.at;const xs=[orig.x,orig.x+orig.w,best.b.x,best.b.x+best.b.w];guides.push({x1:Math.min(...xs),y1:best.at,x2:Math.max(...xs),y2:best.at});}}
  return{x,y,guides};
}
// Apply resize given handle id, original shape, and new world point
function applyResize(sh,handle,orig,wp){
  const os=resizeSnap(orig,handle,wp);           // object-snap (grid off) → adjusted point
  state.guides=os.guides.length?os.guides:null;  // alignment guides during drag
  const sp=snapPt({x:os.x,y:os.y});              // grid-snap (grid on); identity otherwise
  const ox=orig.x,oy=orig.y,ow=orig.w,oh=orig.h;
  const clamp=4; // min size
  if(handle==='p1'){sh.x1=sp.x;sh.y1=sp.y;return}
  if(handle==='p2'){sh.x2=sp.x;sh.y2=sp.y;return}
  switch(handle){
    case 'se':sh.w=Math.max(clamp,sp.x-ox);sh.h=Math.max(clamp,sp.y-oy);break;
    case 's': sh.h=Math.max(clamp,sp.y-oy);break;
    case 'e': sh.w=Math.max(clamp,sp.x-ox);break;
    case 'nw':{const nx=Math.min(sp.x,ox+ow-clamp),ny=Math.min(sp.y,oy+oh-clamp);sh.x=nx;sh.y=ny;sh.w=ox+ow-nx;sh.h=oy+oh-ny;break}
    case 'n': {const ny=Math.min(sp.y,oy+oh-clamp);sh.y=ny;sh.h=oy+oh-ny;break}
    case 'ne':{const ny=Math.min(sp.y,oy+oh-clamp);sh.y=ny;sh.h=oy+oh-ny;sh.w=Math.max(clamp,sp.x-ox);break}
    case 'sw':{const nx=Math.min(sp.x,ox+ow-clamp);sh.x=nx;sh.w=ox+ow-nx;sh.h=Math.max(clamp,sp.y-oy);break}
    case 'w': {const nx=Math.min(sp.x,ox+ow-clamp);sh.x=nx;sh.w=ox+ow-nx;break}
  }
}
// Cursor CSS for a handle id
function handleCursor(id){
  if(id==='nw'||id==='se')return'nwse-resize';
  if(id==='ne'||id==='sw')return'nesw-resize';
  if(id==='n'||id==='s')return'ns-resize';
  if(id==='e'||id==='w')return'ew-resize';
  return'crosshair';
}

function drawSelection(){
  if(state.selection.size===0)return;
  const sel=[...state.selection].map(byId).filter(Boolean);
  if(!sel.length)return;
  const b=G.bboxAll(sel);
  const p1=G.w2s({x:b.x,y:b.y}),p2=G.w2s({x:b.x+b.w,y:b.y+b.h});
  const x=p1.x*DPR,y=p1.y*DPR,w=(p2.x-p1.x)*DPR,h=(p2.y-p1.y)*DPR;
  const lockedSel=sel.every(s=>s.locked);
  ctx.strokeStyle=getCSS('--brand');
  ctx.lineWidth=1.5;ctx.setLineDash(lockedSel?[5*DPR,4*DPR]:[]);
  ctx.strokeRect(x-1,y-1,w+2,h+2);
  ctx.setLineDash([]);
  if(lockedSel)return;
  if(state.selection.size===1){
    const sh=sel[0];
    const hs=HANDLE_SIZE*DPR;
    ctx.fillStyle=getCSS('--paper');
    ctx.strokeStyle=getCSS('--brand-ink');  // dark ring: AAA non-text contrast vs cyan
    ctx.lineWidth=1.5;
    for(const h of getHandles(sh)){
      const sp=G.w2s({x:h.x,y:h.y});
      ctx.fillRect(sp.x*DPR-hs/2,sp.y*DPR-hs/2,hs,hs);
      ctx.strokeRect(sp.x*DPR-hs/2,sp.y*DPR-hs/2,hs,hs);
    }
  }else{
    // Multi-selection: corner handles only
    const hs=HANDLE_SIZE*DPR;
    ctx.fillStyle=getCSS('--paper');ctx.strokeStyle=getCSS('--brand-ink');ctx.lineWidth=1.5;
    for(const[hx,hy] of [[x,y],[x+w,y],[x,y+h],[x+w,y+h]]){
      ctx.fillRect(hx-hs/2,hy-hs/2,hs,hs);
      ctx.strokeRect(hx-hs/2,hy-hs/2,hs,hs);
    }
  }
}
function drawMarquee(){
  const m=state.marquee;
  const p1=G.w2s({x:m.x1,y:m.y1}),p2=G.w2s({x:m.x2,y:m.y2});
  const x=Math.min(p1.x,p2.x)*DPR,y=Math.min(p1.y,p2.y)*DPR;
  const w=Math.abs(p2.x-p1.x)*DPR,h=Math.abs(p2.y-p1.y)*DPR;
  ctx.fillStyle='rgba(0,196,204,.08)';
  ctx.fillRect(x,y,w,h);
  ctx.strokeStyle=getCSS('--brand');
  ctx.lineWidth=1;
  ctx.setLineDash([4*DPR,4*DPR]);
  ctx.strokeRect(x,y,w,h);
  ctx.setLineDash([]);
}

// ====================== INPUT / TOOLS ======================
// One pointer-down starts a tool gesture. Movement accumulates.
// Pointerup commits (add/move/etc) into Store.commit.
let _laser=null;
let _sq='';
let ptr={down:false,x:0,y:0,x0:0,y0:0,wx:0,wy:0,wx0:0,wy0:0,
  panning:false,dragKind:null,dragStartShapes:null};

canvas.addEventListener('pointerdown',e=>{
  if(Presentation.isActive())return;  // no editing during presentation
  canvas.setPointerCapture(e.pointerId);
  const sp={x:e.offsetX,y:e.offsetY};
  const wp=G.s2w(sp);
  ptr.down=true;ptr.x=ptr.x0=sp.x;ptr.y=ptr.y0=sp.y;
  ptr.wx=ptr.wx0=wp.x;ptr.wy=ptr.wy0=wp.y;
  // space or middle click => pan
  const isPan=e.button===1||state.tool==='hand'||e.shiftKey&&state.tool==='select'&&false;
  if(isPan||(state.tool==='hand')){
    ptr.panning=true;canvas.dataset.panning='true';return;
  }
  if(e.button===2){return}       // right-click handled elsewhere
  UI.closeCtxMenu();
  switch(state.tool){
    case 'select':
      // Resize handles take priority over pick (single selection only)
      if(state.selection.size===1){
        const onlySel=byId([...state.selection][0]);
        if(onlySel){
          const hid=hitHandle(wp,onlySel);
          if(hid){
            ptr.dragKind='resize';
            ptr.resizeHandle=hid;
            ptr.resizeOrig=clone(onlySel);
            return;
          }
        }
      }
      pickOrMarquee(wp,e);break;
    case 'pen':beginPen(wp,e);break;
    case 'rect':case 'ellipse':case 'sticky':case 'frame':beginRectLike(wp);break;
    case 'line':case 'arrow':beginLineLike(wp);break;
    case 'text':beginText(wp);break;
    case 'eraser':_eraseBatch=[];eraseAt(wp);break;
  }
  invalidate();
});
canvas.addEventListener('pointermove',e=>{
  const sp={x:e.offsetX,y:e.offsetY};
  const wp=G.s2w(sp);
  if(Presentation.isActive()){_laser=wp;invalidate();return;}
  UI.setStatusXY(Math.round(wp.x),Math.round(wp.y));
  if(!ptr.down){
    // hover feedback
    if(state.tool==='select'){
      // Check for resize handle hover first
      if(state.selection.size===1){
        const onlySel=byId([...state.selection][0]);
        if(onlySel){
          const hid=hitHandle(wp,onlySel);
          if(hid){canvas.style.cursor=handleCursor(hid);return}
        }
      }
      const top=pickTop(wp);
      canvas.style.cursor=top?(top.locked?'not-allowed':'move'):'default';
      if(top?.id!==state.hover){state.hover=top?.id||null;invalidate()}
    }
    return;
  }
  const dx=sp.x-ptr.x0,dy=sp.y-ptr.y0;
  if(ptr.panning){
    state.viewport.x-=(sp.x-ptr.x)/state.viewport.zoom;
    state.viewport.y-=(sp.y-ptr.y)/state.viewport.zoom;
    ptr.x=sp.x;ptr.y=sp.y;invalidate();return;
  }
  switch(state.tool){
    case 'select':
      if(ptr.dragKind==='resize'){
        const rsh=byId([...state.selection][0]);
        if(rsh){
          Object.assign(rsh,clone(ptr.resizeOrig));
          applyResize(rsh,ptr.resizeHandle,ptr.resizeOrig,wp);
        }
        invalidate();
      }else if(ptr.dragKind==='move')doMove(wp);
      else if(ptr.dragKind==='marquee'){state.marquee={x1:ptr.wx0,y1:ptr.wy0,x2:wp.x,y2:wp.y};invalidate()}
      break;
    case 'pen':contPen(wp,e);break;
    case 'rect':case 'ellipse':case 'sticky':case 'frame':contRectLike(wp,e.shiftKey);break;
    case 'line':case 'arrow':contLineLike(wp,e.shiftKey);break;
    case 'eraser':eraseAt(wp);break;
  }
  ptr.x=sp.x;ptr.y=sp.y;ptr.wx=wp.x;ptr.wy=wp.y;
});
canvas.addEventListener('pointerup',e=>{
  if(!ptr.down)return;
  const wp=G.s2w({x:e.offsetX,y:e.offsetY});
  if(ptr.panning){ptr.panning=false;canvas.dataset.panning='false'}
  else{
    switch(state.tool){
    case 'select':
      if(ptr.dragKind==='resize'){
        const rsh=byId([...state.selection][0]);
        if(rsh){
          const after=clone(rsh);
          const before=ptr.resizeOrig;
          if(JSON.stringify(before)!==JSON.stringify(after)){
            Store._recordCommitted({op:'upd',id:rsh.id,before,after});
          }
        }
        ptr.resizeHandle=null;ptr.resizeOrig=null;state.guides=null;
      }else{
        endSelect(wp);
      }
      break;
      case 'pen':endPen();break;
      case 'rect':case 'ellipse':case 'sticky':case 'frame':endRectLike();break;
      case 'line':case 'arrow':endLineLike();break;
      case 'eraser':flushErase();break;
    }
  }
  ptr.down=false;ptr.dragKind=null;ptr.dragStartShapes=null;
  ptr.resizeHandle=null;ptr.resizeOrig=null;
  state.marquee=null;canvas.style.cursor='default';invalidate();
});
canvas.addEventListener('pointercancel',()=>{
  // Restore partial resize/move on cancel (Android touch-takeover, stylus OOR).
  if(ptr.dragKind==='resize'&&ptr.resizeOrig){
    const rsh=byId([...state.selection][0]);
    if(rsh)Object.assign(rsh,clone(ptr.resizeOrig));
  }else if(ptr.dragKind==='move'&&ptr.dragStartShapes){
    for(const[id,orig] of ptr.dragStartShapes){const sh=byId(id);if(sh)Object.assign(sh,clone(orig));}
  }
  ptr.down=false;ptr.panning=false;ptr.dragKind=null;
  ptr.resizeHandle=null;ptr.resizeOrig=null;ptr.dragStartShapes=null;
  canvas.dataset.panning='false';state.draft=null;state.marquee=null;invalidate();
});
canvas.addEventListener('contextmenu',e=>{e.preventDefault();UI.openCtxMenu(e.clientX,e.clientY)});
canvas.addEventListener('pointerleave',()=>{if(_laser){_laser=null;invalidate()}});

// Double-click: re-edit text shapes
canvas.addEventListener('dblclick',e=>{
  const wp=G.s2w({x:e.offsetX,y:e.offsetY});
  const hit=pickTop(wp);
  if(!hit)return;
  if(hit.type==='text'||hit.type==='sticky'){
    openTextEditor(hit,false);
  } else if(hit.type==='frame'||hit.type==='rect'||hit.type==='ellipse'){
    const isFrame=hit.type==='frame';
    const sp=G.w2s(isFrame?{x:hit.x,y:hit.y}:{x:hit.x+hit.w/2,y:hit.y+hit.h/2});
    const r=canvas.getBoundingClientRect();
    const inp=document.createElement('input');
    inp.value=hit.label||'';inp.maxLength=80;
    inp.style.cssText=`position:fixed;left:${r.left+sp.x+(isFrame?6:-40)}px;top:${r.top+sp.y+(isFrame?-24:-12)}px;`+
      `font:${isFrame?'600 ':''}12px system-ui,sans-serif;color:${hit.stroke||getCSS(isFrame?'--brand':'--ink')};`+
      `background:${getCSS('--paper')};border:1px solid ${hit.stroke||getCSS(isFrame?'--brand':'--ink')};`+
      `padding:2px 6px;outline:none;z-index:9500;min-width:80px;`;
    document.body.appendChild(inp);inp.select();
    const commit=()=>{
      const lbl=inp.value.trim();
      if(lbl!==hit.label){const before={label:hit.label??null};const after={label:lbl||null};hit.label=lbl||null;Store._recordCommitted({op:'upd',id:hit.id,before,after});invalidate()}
      inp.remove();
    };
    inp.addEventListener('blur',commit);
    inp.addEventListener('keydown',ev=>{
      if(ev.isComposing)return;
      if(ev.key==='Enter'){ev.preventDefault();commit()}
      // Escape: detach blur→commit so inp.remove() doesn't fire it.
      if(ev.key==='Escape'){inp.removeEventListener('blur',commit);inp.remove()}
    });
  }
});

// ---- Image import: drag-drop ----
canvas.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='copy'});
canvas.addEventListener('drop',e=>{
  e.preventDefault();
  const bf=[...e.dataTransfer.files].find(f=>f.name.endsWith('.board'));
  if(bf){importBoard(bf);return}
  const files=[...e.dataTransfer.files].filter(f=>f.type.startsWith('image/'));
  if(!files.length)return;
  const wp=G.s2w({x:e.offsetX,y:e.offsetY});
  let ox=0;
  for(const f of files){
    const reader=new FileReader();
    reader.onload=()=>{
      if(reader.result.length > 4*1024*1024){
        UI.toast(t('imgBig')+' ('+Math.round(reader.result.length/1024)+'KB)','warn');return;
      }
      const img=new Image();
      img.onload=()=>{
        const maxDim=400;
        let w=img.width,h=img.height;
        if(w>maxDim||h>maxDim){const r=Math.min(maxDim/w,maxDim/h);w*=r;h*=r}
        const sh=Shape.make('image',{x:wp.x+ox,y:wp.y,w,h,dataUrl:reader.result});
        Store.commit({op:'add',shape:sh});
        state.selection.clear();state.selection.add(sh.id);
        invalidate();UI.toast(t('imagePasted'),'ok');
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(f);
    ox+=20;
  }
});

// ---- Image import: clipboard paste ----
window.addEventListener('paste',e=>{
  if(e.target.matches('input,textarea'))return;
  const items=[...e.clipboardData.items].filter(i=>i.type.startsWith('image/'));
  if(!items.length)return;
  e.preventDefault();
  for(const item of items){
    const f=item.getAsFile();if(!f)continue;
    const reader=new FileReader();
    reader.onload=()=>{
      if(reader.result.length > 4*1024*1024){
        UI.toast(t('imgBig')+' ('+Math.round(reader.result.length/1024)+'KB)','warn');return;
      }
      const img=new Image();
      img.onload=()=>{
        const r=canvas.getBoundingClientRect();
        const wp=G.s2w({x:r.width/2,y:r.height/2});
        const maxDim=400;
        let w=img.width,h=img.height;
        if(w>maxDim||h>maxDim){const sc=Math.min(maxDim/w,maxDim/h);w*=sc;h*=sc}
        const sh=Shape.make('image',{x:wp.x-w/2,y:wp.y-h/2,w,h,dataUrl:reader.result});
        Store.commit({op:'add',shape:sh});
        state.selection.clear();state.selection.add(sh.id);
        invalidate();
        UI.toast(t('imagePasted'),'ok');
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(f);
  }
});

// Wheel: zoom (ctrl) or pan
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  if(e.ctrlKey||e.metaKey){
    zoomAt({x:e.offsetX,y:e.offsetY},-e.deltaY*0.005);
  }else{
    state.viewport.x+=e.deltaX/state.viewport.zoom;
    state.viewport.y+=e.deltaY/state.viewport.zoom;
    invalidate();
  }
},{passive:false});

// Pinch zoom (multi-touch via pointer events)
const _pointers=new Map();  // pointerId → {x,y}
canvas.addEventListener('pointerdown',e=>{
  _pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
},{capture:true});
canvas.addEventListener('pointerup',e=>{_pointers.delete(e.pointerId)},{capture:true});
canvas.addEventListener('pointercancel',e=>{_pointers.delete(e.pointerId)},{capture:true});
canvas.addEventListener('pointermove',e=>{
  if(_pointers.size<2){_pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});return}
  const prev=_pointers.get(e.pointerId);
  if(!prev)return;
  _pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const pts=[..._pointers.values()];
  if(pts.length<2)return;
  const curDist=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
  if(!_pinchPrev){_pinchPrev=curDist;return}
  const ratio=curDist/_pinchPrev;
  if(Math.abs(ratio-1)>0.005){
    const cx=(pts[0].x+pts[1].x)/2,cy=(pts[0].y+pts[1].y)/2;
    const r=canvas.getBoundingClientRect();
    zoomAt({x:cx-r.left,y:cy-r.top},Math.log(ratio));
    _pinchPrev=curDist;
  }
},{capture:true,passive:true});
let _pinchPrev=0;
// Reset pinch state when fewer than 2 pointers
const _resetPinch=()=>{if(_pointers.size<2)_pinchPrev=0};
canvas.addEventListener('pointerup',_resetPinch);
canvas.addEventListener('pointercancel',_resetPinch);

function zoomAt(sp,delta){
  const v=state.viewport;
  const wp=G.s2w(sp);
  const nz=Math.max(MIN_ZOOM,Math.min(MAX_ZOOM,v.zoom*Math.exp(delta)));
  v.x=wp.x-sp.x/nz;
  v.y=wp.y-sp.y/nz;
  v.zoom=nz;
  UI.refreshZoom();
  invalidate();
}
function zoomBy(f){
  const r=canvas.getBoundingClientRect();
  zoomAt({x:r.width/2,y:r.height/2},Math.log(f));
}
function zoomReset(){
  state.viewport.zoom=1;
  UI.refreshZoom();invalidate();
}
function fitToContent(){
  const b=G.bboxAll(state.shapes);if(!b){zoomReset();return}
  const pad=40;
  const r=canvas.getBoundingClientRect();
  const zx=(r.width-pad*2)/b.w,zy=(r.height-pad*2)/b.h;
  const z=Math.max(MIN_ZOOM,Math.min(MAX_ZOOM,Math.min(zx,zy,2)));
  state.viewport.zoom=z;
  state.viewport.x=b.x+b.w/2-r.width/(2*z);
  state.viewport.y=b.y+b.h/2-r.height/(2*z);
  UI.refreshZoom();invalidate();
}

// ---- spatial index: uniform 200wu grid, lazy rebuild on _apply; big shapes in
// a `big` list always returned; query covers the 3×3 cell neighbourhood (tol<200wu).
const _GCELL=200;let _grid=null;
function _invalidateGrid(){_grid=null;}
function _buildGrid(shapes){
  const cells=new Map(),big=[];
  for(const s of shapes){
    const b=G.bbox(s);if(!b)continue;
    const x0=Math.floor(Math.min(b.x,b.x+b.w)/_GCELL),x1=Math.floor(Math.max(b.x,b.x+b.w)/_GCELL);
    const y0=Math.floor(Math.min(b.y,b.y+b.h)/_GCELL),y1=Math.floor(Math.max(b.y,b.y+b.h)/_GCELL);
    if(x1-x0>8||y1-y0>8){big.push(s);continue;}
    for(let cx=x0;cx<=x1;cx++)for(let cy=y0;cy<=y1;cy++){
      const k=cx+'|'+cy;let bk=cells.get(k);if(!bk){bk=[];cells.set(k,bk);}bk.push(s);
    }
  }
  return{cells,big};
}
function _queryGrid(grid,pt){
  const cx=Math.floor(pt.x/_GCELL),cy=Math.floor(pt.y/_GCELL),cands=new Set(grid.big);
  for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){
    const bk=grid.cells.get((cx+dx)+'|'+(cy+dy));if(bk)for(const s of bk)cands.add(s);
  }
  return cands;
}
// ---- select tool ----
function pickTop(wp){
  if(state.shapes.length>40){
    if(!_grid)_grid=_buildGrid(state.shapes);
    const cands=_queryGrid(_grid,wp);
    for(let i=state.shapes.length-1;i>=0;i--){const s=state.shapes[i];if(s.type!=='frame'&&cands.has(s)&&G.hit(s,wp))return s;}
    for(let i=state.shapes.length-1;i>=0;i--){const s=state.shapes[i];if(s.type==='frame'&&cands.has(s)&&G.hit(s,wp))return s;}
    return null;
  }
  for(let i=state.shapes.length-1;i>=0;i--){
    const s=state.shapes[i];
    if(s.type==='frame')continue;
    if(G.hit(s,wp))return s;
  }
  for(let i=state.shapes.length-1;i>=0;i--){
    const s=state.shapes[i];
    if(s.type==='frame'&&G.hit(s,wp))return s;
  }
  return null;
}
function pickOrMarquee(wp,e){
  const hit=pickTop(wp);
  if(hit){
    // Hit shape in a group → select the whole group
    const gid=hit.groupId;
    const toSelect=gid
      ? state.shapes.filter(s=>s.groupId===gid).map(s=>s.id)
      : [hit.id];
    const alreadySel=toSelect.every(id=>state.selection.has(id));
    if(!alreadySel){
      if(!e.shiftKey)state.selection.clear();
      for(const id of toSelect)state.selection.add(id);
    }
    ptr.dragKind='move';
    // When moving a frame, also move shapes fully contained within it
    const dragIds=new Set(state.selection);
    for(const selId of state.selection){
      const sel=byId(selId);
      if(sel&&sel.type==='frame'){
        const fb=G.bbox(sel);
        for(const s of state.shapes){
          if(s.id===selId||s.type==='frame')continue;
          const b=G.bbox(s);
          if(b.x>=fb.x&&b.y>=fb.y&&b.x+b.w<=fb.x+fb.w&&b.y+b.h<=fb.y+fb.h){
            dragIds.add(s.id);
          }
        }
      }
    }
    ptr.dragStartShapes=new Map([...dragIds].map(id=>{
      const s=byId(id);return[id,clone(s)];
    }));
  }else{
    if(!e.shiftKey)state.selection.clear();
    ptr.dragKind='marquee';
  }
}
// Snap moving bbox to target edges/centres; returns {dx,dy,guides}. Pure.
function snapBox(mov,targets,tol){
  const mX=[mov.x,mov.x+mov.w/2,mov.x+mov.w],mY=[mov.y,mov.y+mov.h/2,mov.y+mov.h];
  let bx=null,by=null;
  for(const b of targets){
    const tX=[b.x,b.x+b.w/2,b.x+b.w],tY=[b.y,b.y+b.h/2,b.y+b.h];
    for(const m of mX)for(const t of tX){const d=t-m;if(Math.abs(d)<=tol&&(!bx||Math.abs(d)<Math.abs(bx.d)))bx={d,at:t,b};}
    for(const m of mY)for(const t of tY){const d=t-m;if(Math.abs(d)<=tol&&(!by||Math.abs(d)<Math.abs(by.d)))by={d,at:t,b};}
  }
  const guides=[];let dx=0,dy=0;
  if(bx){dx=bx.d;const ys=[mov.y,mov.y+mov.h,bx.b.y,bx.b.y+bx.b.h];guides.push({x1:bx.at,y1:Math.min(...ys),x2:bx.at,y2:Math.max(...ys)});}
  if(by){dy=by.d;const xs=[mov.x,mov.x+mov.w,by.b.x,by.b.x+by.b.w];guides.push({x1:Math.min(...xs),y1:by.at,x2:Math.max(...xs),y2:by.at});}
  return{dx,dy,guides};
}
function objectSnap(dx,dy){
  if(!ptr.dragStartShapes)return{dx:0,dy:0,guides:[]};
  const ids=new Set(ptr.dragStartShapes.keys());
  const bb=G.bboxAll([...ptr.dragStartShapes.values()]);
  if(!bb)return{dx:0,dy:0,guides:[]};
  const mov={x:bb.x+dx,y:bb.y+dy,w:bb.w,h:bb.h},targets=[];
  for(const s of state.shapes){if(ids.has(s.id))continue;const b=G.bbox(s);if(b)targets.push(b)}
  return snapBox(mov,targets,SNAP_OBJ/state.viewport.zoom);
}
// Shared by live drag (doMove) and commit (endSelect) so they agree exactly.
// Grid snap (⇧G) takes precedence; otherwise snap to nearby objects.
function moveDelta(wp){
  const sp=snapPt(wp),sx0=snapV(ptr.wx0),sy0=snapV(ptr.wy0);
  let dx=sp.x-sx0,dy=sp.y-sy0;
  if(!state.snap){const a=objectSnap(dx,dy);dx+=a.dx;dy+=a.dy;state.guides=a.guides.length?a.guides:null;}
  else state.guides=null;
  return{dx,dy};
}
function doMove(wp){
  const{dx,dy}=moveDelta(wp);
  for(const [id,orig] of ptr.dragStartShapes){
    const sh=byId(id);if(!sh||sh.locked)continue;
    Object.assign(sh,clone(orig));
    Shape.translate(sh,dx,dy);
  }
  invalidate();
}
function endSelect(wp){
  if(ptr.dragKind==='move'&&ptr.dragStartShapes){
    const{dx,dy}=moveDelta(wp);
    state.guides=null;
    const mids=[...ptr.dragStartShapes.keys()].filter(id=>!byId(id)?.locked);
    if(Math.hypot(dx,dy)>0.5&&mids.length){
      Store._recordCommitted({op:'move',ids:mids,dx,dy});
    }
  }else if(ptr.dragKind==='marquee'&&state.marquee){
    const m=state.marquee;
    const r={x:Math.min(m.x1,m.x2),y:Math.min(m.y1,m.y2),
      w:Math.abs(m.x2-m.x1),h:Math.abs(m.y2-m.y1)};
    if(r.w>2||r.h>2){
      state.selection.clear();
      for(const s of state.shapes)if(G.marqueeHit(s,r))state.selection.add(s.id);
    }
  }
}

// ---- pen ----
// Coerce pen pressure: mouse=const 0.5, stylus=0..1; finite-safe.
function _penPr(e){const p=e&&e.pressure;return Number.isFinite(p)&&p>0?Math.min(1,p):0.5}
function beginPen(wp,e){
  state.draft=Shape.make('pen',{pts:[[wp.x,wp.y,_penPr(e)]]});
}
function contPen(wp,e){
  if(!state.draft)return;
  const pts=state.draft.pts;
  const last=pts[pts.length-1];
  // decimate by min distance for smoothness
  const d=Math.hypot(wp.x-last[0],wp.y-last[1]);
  if(d>1/state.viewport.zoom)pts.push([wp.x,wp.y,_penPr(e)]);
  invalidate();
}
// RDP decimation for pen pts [[x,y,p?],…]; keeps pressure, eps in world units.
function _rdp(pts,eps){
  if(pts.length<=2)return pts;
  const [ax,ay]=pts[0],[bx,by]=pts[pts.length-1];
  const dx=bx-ax,dy=by-ay,len=Math.hypot(dx,dy)||1;
  let mx=0,idx=1;
  for(let i=1;i<pts.length-1;i++){
    const d=Math.abs(dy*pts[i][0]-dx*pts[i][1]+bx*ay-by*ax)/len;
    if(d>mx){mx=d;idx=i}
  }
  if(mx>eps){
    const L=_rdp(pts.slice(0,idx+1),eps);
    const R=_rdp(pts.slice(idx),eps);
    return L.slice(0,-1).concat(R);
  }
  return [pts[0],pts[pts.length-1]];
}
function endPen(){
  if(!state.draft)return;
  const d=state.draft;state.draft=null;
  if(d.pts.length>=1){
    if(d.pts.length>3)d.pts=_rdp(d.pts,0.5);
    Store.commit({op:'add',shape:d});
  }
}

// ---- rect / ellipse ----
function beginRectLike(wp){
  const sp=snapPt(wp);
  const extras={x:sp.x,y:sp.y,w:0,h:0};
  if(state.tool==='sticky'){
    extras.color=STICKY_COLORS[Math.floor(Math.random()*STICKY_COLORS.length)];
    extras.text='';extras.fontSize=14;
  }else if(state.tool==='frame'){
    const n=state.shapes.filter(s=>s.type==='frame').length+1;
    extras.label=`Frame ${n}`;
    extras.stroke=getCSS('--brand')||'#00C4CC';
    extras.fill=null;extras.size=1.5;
  }
  state.draft=Shape.make(state.tool,extras);
}
function contRectLike(wp,uniform){
  if(!state.draft)return;
  const sp=snapPt(wp);const sx0=snapV(ptr.wx0),sy0=snapV(ptr.wy0);
  let w=sp.x-sx0,h=sp.y-sy0;
  if(uniform){const s=Math.max(Math.abs(w),Math.abs(h));w=Math.sign(w||1)*s;h=Math.sign(h||1)*s}
  const d=state.draft;
  if(w<0){d.x=sx0+w;d.w=-w}else{d.x=sx0;d.w=w}
  if(h<0){d.y=sy0+h;d.h=-h}else{d.y=sy0;d.h=h}
  invalidate();
}
function endRectLike(){
  if(!state.draft)return;
  const d=state.draft;state.draft=null;
  if(d.w<2||d.h<2){
    if(d.type==='sticky'){const sp=snapPt({x:d.x,y:d.y});d.w=160;d.h=160;d.x=sp.x-80;d.y=sp.y-80}
    else if(d.type==='frame'){d.w=800;d.h=500;d.x-=400;d.y-=250}
    else return;
  }
  Store.commit({op:'add',shape:d});
  pickTool('select');
  state.selection.clear();state.selection.add(d.id);
  if(d.type==='sticky')openTextEditor(d,true);
}

// ---- line / arrow ----
function beginLineLike(wp){
  const sp=snapPt(wp);
  state.draft=Shape.make(state.tool,{x1:sp.x,y1:sp.y,x2:sp.x,y2:sp.y});
}
function contLineLike(wp,uniform){
  if(!state.draft)return;
  const sp=snapPt(wp);
  let x2=sp.x,y2=sp.y;
  if(uniform){
    const sx0=snapV(ptr.wx0),sy0=snapV(ptr.wy0);
    const dx=x2-sx0,dy=y2-sy0;
    const a=Math.atan2(dy,dx);
    const q=Math.round(a/(Math.PI/4))*(Math.PI/4);
    const d=Math.hypot(dx,dy);
    x2=sx0+Math.cos(q)*d;y2=sy0+Math.sin(q)*d;
  }
  state.draft.x2=x2;state.draft.y2=y2;
  invalidate();
}
function endLineLike(){
  if(!state.draft)return;
  const d=state.draft;state.draft=null;
  if(Math.hypot(d.x2-d.x1,d.y2-d.y1)<2)return;
  // Bind each endpoint dropped on a shape so the connector follows it (not both to one).
  const ba=_bindAt(d.x1,d.y1),bb=_bindAt(d.x2,d.y2);
  if(ba&&ba!==bb)d.a=ba;
  if(bb&&bb!==ba)d.b=bb;
  Store.commit({op:'add',shape:d});
  pickTool('select');state.selection.clear();state.selection.add(d.id);
}
// Topmost non-connector shape whose bbox contains (x,y), for connector binding.
function _bindAt(x,y){
  for(let i=state.shapes.length-1;i>=0;i--){
    const s=state.shapes[i],t=s.type;
    if(t==='line'||t==='arrow'||t==='pen')continue;
    const b=G.bbox(s);
    if(x>=b.x&&y>=b.y&&x<=b.x+b.w&&y<=b.y+b.h)return s.id;
  }
  return null;
}

// ---- text ----
function beginText(wp){
  const sp=snapPt(wp);
  const s=Shape.make('text',{x:sp.x,y:sp.y,w:120,h:24,text:'',fontSize:16});
  Store.commit({op:'add',shape:s});
  openTextEditor(s,true);
  pickTool('select');
}
// ---- keyboard shape creation (a11y) ----
// Create a default-sized shape of the active tool, centred in the viewport, so the
// whole create→select→edit loop is reachable without a pointer (complements the
// Tab navigation added in v1.6.10). Returns true if a shape was created/handled.
function createShapeKbd(){
  const tool=state.tool,view=visibleWorldRect();
  const cx=Math.round(view.x+view.w/2),cy=Math.round(view.y+view.h/2);
  let s;
  if(tool==='rect'||tool==='ellipse'){
    s=Shape.make(tool,{x:cx-60,y:cy-40,w:120,h:80});
  }else if(tool==='line'||tool==='arrow'){
    s=Shape.make(tool,{x1:cx-80,y1:cy,x2:cx+80,y2:cy});
  }else if(tool==='sticky'){
    s=Shape.make('sticky',{x:cx-80,y:cy-80,w:160,h:160,
      color:STICKY_COLORS[Math.floor(Math.random()*STICKY_COLORS.length)],text:'',fontSize:14});
  }else if(tool==='frame'){
    const n=state.shapes.filter(x=>x.type==='frame').length+1;
    s=Shape.make('frame',{x:cx-400,y:cy-250,w:800,h:500,
      label:`Frame ${n}`,stroke:getCSS('--brand')||'#00C4CC',fill:null,size:1.5});
  }else if(tool==='text'){
    beginText({x:cx-60,y:cy-12});   // opens editor + switches to select
    return true;
  }else{
    return false;   // pen/select/hand/eraser — nothing to create from the keyboard
  }
  Store.commit({op:'add',shape:s});
  pickTool('select');
  state.selection=new Set([s.id]);
  UI.toast(`${t('created')}: ${describeShape(s)}`);
  if(s.type==='sticky')openTextEditor(s,true);
  invalidate();
  return true;
}
function openTextEditor(s,isNew){
  state.editing=s.id;invalidate();
  const ta=document.createElement('textarea');
  ta.className='text-overlay';
  const origText=s.text||'';
  const orig=clone(s);
  ta.value=origText;
  ta.spellcheck=false;
  positionTextEditor(ta,s);
  document.body.appendChild(ta);
  ta.focus();
  const auto=()=>{
    ta.style.height='auto';
    ta.style.width='auto';
    const newW=Math.max(40,ta.scrollWidth+4);
    const newH=Math.max(20,ta.scrollHeight);
    ta.style.width=newW+'px';
    ta.style.height=newH+'px';
  };
  ta.addEventListener('input',auto);
  ta.addEventListener('blur',()=>{
    const newText=ta.value;
    s.text=newText;
    // measure
    ctx.save();
    ctx.font=`${s.fontSize}px Hiragino Sans,Helvetica Neue,system-ui,sans-serif`;
    const lines=(s.text||'').split('\n');
    let mw=0;for(const l of lines)mw=Math.max(mw,ctx.measureText(l).width);
    s.w=Math.max(20,mw);s.h=Math.max(s.fontSize*1.25,lines.length*s.fontSize*1.25);
    ctx.restore();
    state.editing=null;
    if(isNew){
      // New text: empty → undo the add; non-empty → patch the add op
      if(!newText.trim()){
        Store.undo();
        state.history.length=state.histIdx+1;
        UI.refreshUndo();
      }else{
        state.history[state.histIdx].shape=clone(s);
        state.dirty=true;Persist.schedule();
      }
    }else{
      // Existing text: emptied → delete original (single undo); else changed → upd
      if(!newText.trim()){
        Store.commit({op:'del',shapes:[orig]});
      }else if(newText!==origText){
        const before={text:origText,w:orig.w,h:orig.h};
        const after={text:newText,w:s.w,h:s.h};
        Store._recordCommitted({op:'upd',id:s.id,before,after});
      }
    }
    ta.remove();invalidate();
  });
  ta.addEventListener('keydown',ev=>{
    if(ev.isComposing)return;
    if(ev.key==='Escape'){ev.preventDefault();ta.blur()}
    if(ev.key==='Enter'&&(ev.metaKey||ev.ctrlKey)){ev.preventDefault();ta.blur()}
  });
  auto();
}
function positionTextEditor(ta,s){
  const sp=G.w2s({x:s.x,y:s.y});
  const r=canvas.getBoundingClientRect();
  ta.style.left=(r.left+sp.x)+'px';
  ta.style.top=(r.top+sp.y)+'px';
  ta.style.fontSize=(s.fontSize*state.viewport.zoom)+'px';
  ta.style.color=s.stroke||'#0F172A';
  ta.style.minWidth='20px';
}

// ---- eraser ----
let _eraseBatch=[];    // shapes collected during one eraser stroke
function eraseAt(wp){
  const hit=pickTop(wp);
  if(hit&&!hit.locked&&!_eraseBatch.some(s=>s.id===hit.id)){
    // Remove from rendering immediately for feedback
    const i=state.shapes.findIndex(s=>s.id===hit.id);
    if(i>=0)state.shapes.splice(i,1);
    _eraseBatch.push(clone(hit));
    invalidate();
  }
}
function flushErase(){
  if(!_eraseBatch.length)return;
  // Restore shapes so Store.commit's _apply can find & remove them
  for(const s of _eraseBatch)state.shapes.push(s);
  sortZ();
  Store.commit({op:'del',shapes:clone(_eraseBatch)});
  _eraseBatch=[];
}

// ====================== KEYBOARD ======================
const KEYMAP={v:'select',h:'hand',p:'pen',r:'rect',o:'ellipse',
  a:'arrow',l:'line',t:'text',n:'sticky',f:'frame',e:'eraser'};
window.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea')){
    if(e.key==='Escape')e.target.blur();
    return;
  }
  const meta=e.metaKey||e.ctrlKey;
  const k=e.key.toLowerCase();
  if(meta&&k==='z'&&!e.shiftKey){e.preventDefault();if(Store.undo())UI.toast(t('undone'))}
  else if(meta&&(k==='y'||(k==='z'&&e.shiftKey))){e.preventDefault();if(Store.redo())UI.toast(t('redone'))}
  else if(meta&&k==='a'){e.preventDefault();state.selection=new Set(state.shapes.map(s=>s.id));invalidate()}
  // Presentation mode navigation
  if(Presentation.isActive()){
    if(k==='arrowright'||k==='arrowdown'||k===' '){e.preventDefault();Presentation.next()}
    else if(k==='arrowleft'||k==='arrowup'){e.preventDefault();Presentation.prev()}
    else if(k==='escape'){Presentation.leave()}
    return;
  }
  if(k==='p'&&e.shiftKey&&!meta&&!e.altKey){e.preventDefault();Presentation.enter();return}
  else if(meta&&k==='enter'){e.preventDefault();Presentation.enter()}
  else if(meta&&k==='c'){e.preventDefault();doCopy()}
  else if(meta&&k==='v'){e.preventDefault();doPaste()}
  else if(meta&&k==='x'){e.preventDefault();doCopy();doDelete()}
  else if(meta&&k==='d'){e.preventDefault();doDuplicate()}
  else if(meta&&k==='e'&&e.shiftKey){e.preventDefault();exportSVG()}
  else if(meta&&k==='e'&&!e.shiftKey){e.preventDefault();exportPNG()}
  else if(k==='c'&&e.altKey&&!meta){e.preventDefault();copyStyle()}
  else if(k==='v'&&e.altKey&&!meta){e.preventDefault();pasteStyle()}
  else if(meta&&k==='s'&&e.shiftKey){e.preventDefault();exportBoard()}
  else if(meta&&k==='s'&&!e.shiftKey){e.preventDefault();Persist.save(true)}
  else if(meta&&k==='p'){e.preventDefault();exportPDF()}
  else if(meta&&(k==='='||k==='+')){e.preventDefault();zoomBy(1.2)}
  else if(meta&&k==='-'){e.preventDefault();zoomBy(1/1.2)}
  else if(meta&&k==='0'){e.preventDefault();zoomReset()}
  else if(k==='delete'||k==='backspace'){e.preventDefault();doDelete()}
  else if(k==='tab'){
    // Cycle selection (z-order) for keyboard/SR users; wraps, recentres, announces.
    e.preventDefault();
    const ids=state.shapes.map(s=>s.id);
    if(!ids.length)return;
    const id=cycleSel(ids,[...state.selection][0],e.shiftKey?-1:1);
    state.selection=new Set([id]);
    const sh=byId(id);
    if(sh){
      if(!inView(sh,visibleWorldRect()))centerOn(sh);
      UI.toast(`${describeShape(sh)} (${ids.indexOf(id)+1}/${ids.length})`);
    }
    invalidate();
  }
  else if(k==='enter'&&!meta&&!e.shiftKey){
    // Place active tool's default shape at viewport centre (no-op for select/hand/eraser/pen).
    if(createShapeKbd())e.preventDefault();
  }
  else if(k==='arrowup'||k==='arrowdown'||k==='arrowleft'||k==='arrowright'){
    if(state.selection.size){
      e.preventDefault();
      const step=e.shiftKey?10:1;
      const dx=k==='arrowleft'?-step:k==='arrowright'?step:0;
      const dy=k==='arrowup'?-step:k==='arrowdown'?step:0;
      for(const id of state.selection){const sh=byId(id);if(sh)Shape.translate(sh,dx,dy)}
      Store._recordCommitted({op:'move',ids:[...state.selection],dx,dy});
      invalidate();
    }
  }
  else if(k==='escape'){
    // WCAG: Escape dismisses an open modal first, else clears selection/draft.
    const ctx2=document.getElementById('ctx');
    if(ctx2.dataset.open==='true'){UI.closeCtxMenu();return}
    const hp=document.getElementById('help'),sp2=document.getElementById('share');
    if(hp.dataset.open==='true')UI.toggleHelp();
    else if(sp2.dataset.open==='true')UI.closeShare();
    else{state.selection.clear();state.marquee=null;state.draft=null;state.guides=null;invalidate()}
  }
  else if(k==='?'||(e.shiftKey&&e.key==='/')){e.preventDefault();UI.toggleHelp()}
  else if(k===']'&&!meta&&e.shiftKey){e.preventDefault();doBringFront()}
  else if(k==='['&&!meta&&e.shiftKey){e.preventDefault();doSendBack()}
  else if(k===']'&&!meta){e.preventDefault();doBringForward()}
  else if(k==='['&&!meta){e.preventDefault();doSendBackward()}
  else if(meta&&k==='g'&&e.shiftKey){e.preventDefault();doUngroup()}
  else if(meta&&k==='g'&&!e.shiftKey){e.preventDefault();doGroup()}
  else if(k==='g'&&!meta&&e.shiftKey){state.snap=!state.snap;UI.toast(`${t('snap')} ${state.snap?t('on'):t('off')}`)}
  else if(k==='g'&&!meta){state.showGrid=!state.showGrid;invalidate();UI.toast(`${t('grid')} ${state.showGrid?t('on'):t('off')}`)}
  else if(e.shiftKey&&k==='1'){e.preventDefault();fitToContent()}
  else if(e.shiftKey&&!meta&&!e.altKey&&(k==='h'||k==='v')&&state.selection.size){e.preventDefault();doFlip(k)}
  else if(k===','&&!meta&&state.selection.size){e.preventDefault();doRotate(-15)}
  else if(k==='.'&&!meta&&state.selection.size){e.preventDefault();doRotate(15)}
  else if(meta&&k==='f'){e.preventDefault();const sq=document.getElementById('sqinput');if(sq){sq.style.display=sq.style.display==='none'?'block':'none';if(sq.style.display!=='none'){sq.focus();sq.select();}else{_sq='';invalidate();}}}
  else if(!meta&&KEYMAP[k]){pickTool(KEYMAP[k])}
  else if(k===' '&&!meta){e.preventDefault();pickTool('hand',true)}
});
window.addEventListener('keyup',e=>{
  if(e.key===' '&&state.tool==='hand'&&window._prevTool){
    pickTool(window._prevTool);window._prevTool=null;
  }
});
function pickTool(tool,temporary){
  if(temporary&&!window._prevTool)window._prevTool=state.tool;
  state.tool=tool;canvas.dataset.tool=tool;
  canvas.setAttribute('aria-label',tool+' — Drawing canvas. Tab/Shift+Tab cycles shapes, Enter creates, arrows move.');
  for(const b of document.querySelectorAll('.tool'))b.setAttribute('aria-pressed',b.dataset.tool===tool);
  // hide style panel for select/hand
  const sp=document.getElementById('stylePanel');
  sp.hidden=tool==='select'||tool==='hand'||tool==='eraser';
}

// ====================== CLIPBOARD-LIKE ops ======================
function doCopy(){
  const sel=[...state.selection].map(byId).filter(Boolean);
  if(!sel.length)return;
  state.clipboard={shapes:clone(sel)};
  UI.toast(t('copied')+' '+sel.length);
}
function doPaste(){
  if(!state.clipboard)return;
  const offset=20/state.viewport.zoom;
  const added=[];
  const gidMap=new Map();
  for(const orig of state.clipboard.shapes){
    const sh=clone(orig);
    sh.id=uid();sh.z=nextZ();
    if(sh.groupId){
      if(!gidMap.has(sh.groupId))gidMap.set(sh.groupId,uid());
      sh.groupId=gidMap.get(sh.groupId);
    }
    Shape.translate(sh,offset,offset);
    Store.commit({op:'add',shape:sh});
    added.push(sh.id);
  }
  // offset next paste a bit more
  for(const s of state.clipboard.shapes){
    Shape.translate(s,offset,offset);
  }
  state.selection=new Set(added);
  invalidate();
  UI.toast(t('pasted')+' '+added.length);
}
function doDuplicate(){
  if(!state.selection.size)return;
  const sel=[...state.selection].map(byId).filter(Boolean);
  state.clipboard={shapes:clone(sel)};
  doPaste();
}
function doDelete(){
  const sel=[...state.selection].map(byId).filter(s=>s&&!s.locked);
  if(!sel.length)return;
  Store.commit({op:'del',shapes:clone(sel)});
  state.selection.clear();
  UI.toast(t('deleted')+' '+sel.length);
}
// z-order ops snapshot every shape's z → reversible `zorder` op (before/after), broadcast.
function _zSnapshot(){return state.shapes.map(s=>({id:s.id,z:s.z||0}))}
function _commitZ(before){
  const after=_zSnapshot();
  if(JSON.stringify(before)===JSON.stringify(after)){invalidate();return}
  Store._recordCommitted({op:'zorder',before,after});
  invalidate();Persist.schedule();
}
function doBringFront(){
  const ids=[...state.selection];
  if(!ids.length)return;
  const before=_zSnapshot();
  for(const id of ids){
    const i=state.shapes.findIndex(s=>s.id===id);if(i<0)continue;
    const sh=state.shapes[i];sh.z=nextZ();
    state.shapes.splice(i,1);state.shapes.push(sh);
  }
  _commitZ(before);
}
function doSendBack(){
  const ids=[...state.selection];
  if(!ids.length)return;
  const before=_zSnapshot();
  const minZ=Math.min(...state.shapes.map(s=>s.z||0));
  let off=1;
  for(const id of ids){
    const i=state.shapes.findIndex(s=>s.id===id);if(i<0)continue;
    const sh=state.shapes[i];
    sh.z=minZ-(off++);
    state.shapes.splice(i,1);state.shapes.unshift(sh);
  }
  _commitZ(before);
}
function doBringForward(){
  // move up one step in z-order
  const ids=[...state.selection];if(!ids.length)return;
  const before=_zSnapshot();
  for(const id of ids){
    const i=state.shapes.findIndex(s=>s.id===id);if(i<0||i===state.shapes.length-1)continue;
    const tmp=state.shapes[i];state.shapes[i]=state.shapes[i+1];state.shapes[i+1]=tmp;
    tmp.z=(state.shapes[i].z||0)+1;
  }
  _commitZ(before);
}
function doSendBackward(){
  const ids=[...state.selection];if(!ids.length)return;
  const before=_zSnapshot();
  for(const id of ids){
    const i=state.shapes.findIndex(s=>s.id===id);if(i<=0)continue;
    const tmp=state.shapes[i];state.shapes[i]=state.shapes[i-1];state.shapes[i-1]=tmp;
    tmp.z=Math.max(0,(state.shapes[i].z||0)-1);
  }
  _commitZ(before);
}
function doGroup(){
  const ids=[...state.selection];
  if(ids.length<2){UI.toast(t('selectTwo'),'warn');return}
  const gid=uid();
  const before=ids.map(id=>({id,groupId:byId(id)?.groupId}));
  for(const id of ids){const sh=byId(id);if(sh)sh.groupId=gid}
  Store._recordCommitted({op:'group',ids,gid,before});
  UI.toast(t('grouped'),'ok');
  invalidate();
}
function doUngroup(){
  const ids=[...state.selection];
  // find all groupIds touched by selection
  const gids=new Set(ids.map(id=>byId(id)?.groupId).filter(Boolean));
  if(!gids.size){UI.toast(t('noGroup'),'warn');return}
  const ungrouped=[],before=[];
  for(const s of state.shapes){
    if(gids.has(s.groupId)){before.push({id:s.id,groupId:s.groupId});delete s.groupId;ungrouped.push(s.id)}
  }
  state.selection=new Set(ungrouped);
  Store._recordCommitted({op:'ungroup',ids:ungrouped,gids:[...gids],before});
  UI.toast(t('ungrouped'),'ok');
  invalidate();
}
function doClearAll(){
  if(!state.shapes.length)return;
  if(!confirm(t('confirmClear')))return;
  Store.commit({op:'clear',shapes:clone(state.shapes)});
  UI.toast(t('cleared'));
}

// ---- alignment (multiple selection) ----
function doAlign(dir){
  const sel=[...state.selection].map(byId).filter(Boolean);
  if(sel.length<2)return;
  const bboxes=sel.map(s=>({s,b:G.bbox(s)}));
  // Capture before state (full shape clone)
  const beforeSnap=sel.map(s=>clone(s));
  switch(dir){
    case 'left':{const mn=Math.min(...bboxes.map(({b})=>b.x));for(const {s,b} of bboxes)Shape.translate(s,mn-b.x,0);break}
    case 'right':{const mx=Math.max(...bboxes.map(({b})=>b.x+b.w));for(const {s,b} of bboxes)Shape.translate(s,mx-b.x-b.w,0);break}
    case 'cx':{const cx=(Math.min(...bboxes.map(({b})=>b.x))+Math.max(...bboxes.map(({b})=>b.x+b.w)))/2;for(const {s,b} of bboxes)Shape.translate(s,cx-b.x-b.w/2,0);break}
    case 'top':{const mn=Math.min(...bboxes.map(({b})=>b.y));for(const {s,b} of bboxes)Shape.translate(s,0,mn-b.y);break}
    case 'bottom':{const mx=Math.max(...bboxes.map(({b})=>b.y+b.h));for(const {s,b} of bboxes)Shape.translate(s,0,mx-b.y-b.h);break}
    case 'cy':{const cy=(Math.min(...bboxes.map(({b})=>b.y))+Math.max(...bboxes.map(({b})=>b.y+b.h)))/2;for(const {s,b} of bboxes)Shape.translate(s,0,cy-b.y-b.h/2);break}
    case 'hspace':{
      bboxes.sort((a,b)=>a.b.x-b.b.x);
      const totalW=bboxes.reduce((a,{b})=>a+b.w,0);
      const gap=(Math.max(...bboxes.map(({b})=>b.x+b.w))-Math.min(...bboxes.map(({b})=>b.x))-totalW)/(bboxes.length-1);
      let cx2=bboxes[0].b.x;for(const {s,b} of bboxes){Shape.translate(s,cx2-b.x,0);cx2+=b.w+gap}break}
    case 'vspace':{
      bboxes.sort((a,b)=>a.b.y-b.b.y);
      const totalH=bboxes.reduce((a,{b})=>a+b.h,0);
      const gap2=(Math.max(...bboxes.map(({b})=>b.y+b.h))-Math.min(...bboxes.map(({b})=>b.y))-totalH)/(bboxes.length-1);
      let cy2=bboxes[0].b.y;for(const {s,b} of bboxes){Shape.translate(s,0,cy2-b.y);cy2+=b.h+gap2}break}
  }
  const afterSnap=sel.map(s=>clone(s));
  Store._recordCommitted({op:'align',dir,before:beforeSnap,after:afterSnap});
  invalidate();Persist.schedule();
}

// Flip: mirror across selection-bbox centre, recorded as an `align` op. See docs.
function flipShape(s,axis,c){
  const m=v=>2*c-v;
  if(axis==='h'){
    if(s.pts)for(const p of s.pts)p[0]=m(p[0]);
    else if(s.x1!=null){s.x1=m(s.x1);s.x2=m(s.x2)}
    else s.x=m(s.x+s.w);
  }else{
    if(s.pts)for(const p of s.pts)p[1]=m(p[1]);
    else if(s.y1!=null){s.y1=m(s.y1);s.y2=m(s.y2)}
    else s.y=m(s.y+s.h);
  }
  if(s.rotate)s.rotate=(360-s.rotate)%360;
}
function doFlip(axis){
  const sel=[...state.selection].map(byId).filter(s=>s&&!s.locked);
  if(!sel.length)return;
  const bb=G.bboxAll(sel),c=axis==='h'?bb.x+bb.w/2:bb.y+bb.h/2;
  const before=sel.map(s=>clone(s));
  for(const s of sel)flipShape(s,axis,c);
  const after=sel.map(s=>clone(s));
  Store._recordCommitted({op:'align',dir:'flip',before,after});
  invalidate();Persist.schedule();
}

function doLock(){
  const sel=[...state.selection].map(byId).filter(Boolean);
  if(!sel.length)return;
  const lk=!sel[0].locked;
  const before=sel.map(s=>({id:s.id,locked:s.locked??null}));
  for(const s of sel)s.locked=lk||null;
  const after=sel.map(s=>({id:s.id,locked:s.locked??null}));
  Store._recordCommitted({op:'align',dir:'lock',before,after});
  invalidate();Persist.schedule();
}
function doRotate(d){
  // Box shapes only (s.w defined): pen/line/arrow are point geometry with no box centre.
  const sel=[...state.selection].map(byId).filter(s=>s&&!s.locked&&s.w!=null);
  if(!sel.length)return;
  const bb=G.bboxAll(sel),gx=bb.x+bb.w/2,gy=bb.y+bb.h/2; // orbit about group centre, like doFlip
  const r=d*Math.PI/180,cs=Math.cos(r),sn=Math.sin(r);
  const before=sel.map(s=>clone({...s,rotate:s.rotate||0}));
  for(const s of sel){
    const b=G.bbox(s),cx=b.x+b.w/2,cy=b.y+b.h/2;
    const nx=gx+(cx-gx)*cs-(cy-gy)*sn,ny=gy+(cx-gx)*sn+(cy-gy)*cs;
    Shape.translate(s,nx-cx,ny-cy);
    s.rotate=((s.rotate||0)+d+360)%360;
  }
  const after=sel.map(s=>clone(s));
  Store._recordCommitted({op:'align',dir:'rotate',before,after});
  invalidate();Persist.schedule();
}
// ====================== EXPORT ======================
function exportPNG(){
  const b=G.bboxAll(state.shapes);
  if(!b){UI.toast(t('empty'),'warn');return}
  const pad=32;
  const w=Math.ceil(b.w+pad*2),h=Math.ceil(b.h+pad*2);
  const off=document.createElement('canvas');
  const scale=2;
  off.width=w*scale;off.height=h*scale;
  const oc=off.getContext('2d');
  oc.fillStyle=getCSS('--paper');
  oc.fillRect(0,0,off.width,off.height);
  oc.setTransform(scale,0,0,scale,-b.x*scale+pad*scale,-b.y*scale+pad*scale);
  for(const s of state.shapes)drawShape(s,oc);
  off.toBlob(bl=>{
    if(!bl){UI.toast(t('exportFailed'),'err');return}
    const url=URL.createObjectURL(bl);
    const a=document.createElement('a');
    a.href=url;a.download=`${state.docName||'board'}.png`;
    a.click();setTimeout(()=>URL.revokeObjectURL(url),1e4);
    UI.toast(t('exported'),'ok');
  },'image/png');
}

function exportPDF(){
  if(!state.shapes.length){UI.toast(t('empty'),'warn');return}
  const b=G.bboxAll(state.shapes);if(!b)return;
  const pad=32,W=Math.ceil(b.w+pad*2),H=Math.ceil(b.h+pad*2),dpr=window.devicePixelRatio||1;
  let off;try{off=new OffscreenCanvas(W*dpr,H*dpr)}catch(_){off=document.createElement('canvas');off.width=W*dpr;off.height=H*dpr}
  const oc=off.getContext('2d');
  oc.fillStyle=getCSS('--paper')||'#fff';oc.fillRect(0,0,W*dpr,H*dpr);
  oc.setTransform(dpr,0,0,dpr,(-b.x+pad)*dpr,(-b.y+pad)*dpr);
  for(const s of state.shapes)drawShape(s,oc);
  const fin=bl=>{
    if(!bl){UI.toast(t('exportFailed'),'err');return}
    const url=URL.createObjectURL(bl);
    const w2=window.open('');
    if(!w2){UI.toast(t('popupBlocked'),'warn');return}
    w2.document.write(`<!DOCTYPE html><html><head><title>${_esc(state.docName||'board')}</title><style>*{margin:0;padding:0}img{max-width:100%;display:block}</style></head><body><img src="${url}" onload="window.print();window.close()"></body></html>`);
    w2.document.close();setTimeout(()=>URL.revokeObjectURL(url),30e3);
  };
  if(typeof off.toBlob==='function')off.toBlob(fin,'image/png');
  else off.convertToBlob({type:'image/png'}).then(fin);
}

function exportSVG(){
  const svg=buildSVG(state.shapes,getCSS('--paper'));
  if(svg===null){UI.toast(t('empty'),'warn');return}
  const blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'});
  const url=URL.createObjectURL(blob);

        break;}
      case 'ellipse':

        if(s.label)els.push(`<text x="${X+W/2+ox}" y="${Y+H/2+oy+7}" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle" fill="${stroke}"${a}${rT}>${_esc(s.label)}</text>`);
        break;
      case 'line':
        els.push(`<line x1="${X1+ox}" y1="${Y1+oy}" x2="${X2+ox}" y2="${Y2+oy}" stroke="${stroke}" stroke-width="${SZ||1}" stroke-linecap="round"${dA}${a}/>`);
        break;
      case 'arrow':{
        els.push(`<line x1="${X1+ox}" y1="${Y1+oy}" x2="${X2+ox}" y2="${Y2+oy}" stroke="${stroke}" stroke-width="${SZ||1}" stroke-linecap="round"${dA}${a}/>`);
        const ah=Math.max(6,(SZ||2)*3);

        for(let i=0;i<svgLines.length;i++)els.push(`<tspan x="${X+ox}" dy="${i?fs*1.25:0}">${_esc(svgLines[i])}</tspan>`);

      case 'image':

        break;
      case 'frame':{
        const fr=Math.min(4,W/10,H/10);
        const clr=_esc(s.stroke||'#00C4CC');
        els.push(`<rect x="${X+ox}" y="${Y+oy}" width="${W}" height="${H}" rx="${fr}" fill="rgba(248,250,252,0.6)" stroke="${clr}" stroke-width="${SZ||1.5}"${a}${rT}/>`);
        if(s.label)els.push(`<text x="${X+ox+6}" y="${Y+oy-4}" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="${clr}"${rT}>${_esc(s.label)}</text>`);
        break;}
      case 'sticky':{
        const r=Math.min(6,Math.abs(W)/6,Math.abs(H)/6);
        els.push(`<rect x="${X+ox}" y="${Y+oy}" width="${W}" height="${H}" rx="${r}" fill="${_esc(s.color||'#FEF08A')}" stroke="rgba(0,0,0,.06)"${rT}/>`);
        if(s.text){

          els.push(`<text x="${X+ox+pad2}" y="${Y+oy+pad2+fs}" font-family="Hiragino Sans,Helvetica Neue,system-ui,sans-serif" font-size="${fs}" fill="#1E293B"${rT}>`);
          for(let i=0;i<lines2.length;i++)els.push(`<tspan x="${X+ox+pad2}" dy="${i?fs*1.3:0}">${_esc(lines2[i])}</tspan>`);

// Coerce to finite number; prevents string geometry breaking SVG numeric attributes.
