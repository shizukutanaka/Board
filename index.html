// Word-wrap to maxWidth: honours \n, wraps on whitespace, hard-breaks long tokens.
function wrapText(text,maxWidth,measure){
  const out=[];
  for(const para of String(text==null?'':text).split('\n')){
    if(para===''){out.push('');continue;}
    if(!(maxWidth>0)||measure(para)<=maxWidth){out.push(para);continue;}
    let line='';
    for(const tok of (para.match(/\s+|\S+/g)||[])){
      if(line===''&&/^\s+$/.test(tok))continue;            // no leading space on a wrapped line
      if(measure(line+tok)<=maxWidth){line+=tok;continue;}
      if(line!==''){out.push(line.replace(/\s+$/,''));line='';if(/^\s+$/.test(tok))continue;}
      if(measure(tok)<=maxWidth){line=tok;continue;}
      let chunk='';                                         // single token longer than the line → char-break
      for(const ch of tok){
        if(chunk===''||measure(chunk+ch)<=maxWidth){chunk+=ch;}
        else{out.push(chunk);chunk=ch;}
      }
      line=chunk;
    }
    if(line!=='')out.push(line.replace(/\s+$/,''));
  }
  return out;
}

// ====================== NET (sync layer) ======================
// BroadcastChannel (same-browser tabs) + WebRTC DataChannel (cross-machine, manual
// signalling, no server). All ops carry a CRDT clock, dedup by peer:seq, idempotent.
const Net={
  bc:null,                    // BroadcastChannel
  rtc:null,                   // RTCPeerConnection
  dc:null,                    // RTCDataChannel
  _presenceTimer:0,
  _onConnChange:null,         // UI callback
  init(roomId){
    if(this.bc){try{this.bc.close()}catch(_){}}
    state.roomId=roomId||DOC_KEY;
    if(typeof BroadcastChannel==='undefined')return;     // not supported
    try{
      this.bc=new BroadcastChannel(NET_CHANNEL_PREFIX+state.roomId);
      this.bc.onmessage=e=>this._onRecv(e.data);
      // announce arrival + request snapshot
      this._send({k:'hello',peer:state.peerId,seq:state.seq});
      this._send({k:'sync-req',peer:state.peerId});
      this._presenceTimer=setInterval(()=>{
        this._send({k:'ping',peer:state.peerId,seq:state.seq});
        this._reapPeers();
      },NET_PRESENCE_INTERVAL);
    }catch{}
  },
  // Outbound: from local Store.commit
  broadcast(op){
    this._send({k:'op',op});
    if(this.dc&&this.dc.readyState==='open'){
      try{this.dc.send(JSON.stringify({k:'op',op}))}catch(_){}
    }
  },
  _send(msg){
    if(this.bc){try{this.bc.postMessage(msg)}catch(_){}}
  },
  _onRecv(msg){
    if(!msg||typeof msg!=='object'||msg.peer===state.peerId)return;
    switch(msg.k){
      case 'op':{
        // Validate op shape before applying — reject garbage from bad peers
        const op=msg.op;
        if(!op||typeof op!=='object'||typeof op.op!=='string')break;
        if(!op.clock||typeof op.clock.peer!=='string'||typeof op.clock.seq!=='number')break;
        Store.applyRemote(op);break;}
      case 'hello':
        this._touchPeer(msg.peer);
        // send snapshot to newcomer (only one peer should — pick by id ordering)
        if(state.peerId<msg.peer)this._sendSnapshot();
        break;
      case 'sync-req':
        this._touchPeer(msg.peer);
        if(state.peerId<msg.peer)this._sendSnapshot();
        break;
      case 'snapshot':
        if(state.shapes.length===0)this._applySnapshot(msg);
        // Already have shapes: merge — adopt only shapes we don't have yet.
        else if(Array.isArray(msg.ops))for(const op of msg.ops){
          if(op.op==='add'&&op.shape&&byId(op.shape.id))continue;
          Store.applyRemote(op);
        }
        break;
      case 'ping':
        this._touchPeer(msg.peer);
        break;
    }
  },
  _sendSnapshot(){
    // Snapshot = all shapes as add ops. Each needs a DISTINCT clock key, else
    // applyRemote's peer:seq dedup collapses the batch to the first shape (peer:0 collision).
    const ops=state.shapes.map((s,i)=>({
      op:'add',shape:clone(s),
      clock:{peer:state.peerId,seq:'snap'+i,ts:0,_snap:true}
    }));
    this._send({k:'snapshot',shapes:clone(state.shapes),ops,peer:state.peerId});
  },
  _applySnapshot(msg){
    // Validate snapshot shapes before adopting
    const shapes=msg.shapes;
    if(!Array.isArray(shapes))return;
    const valid=shapes.filter(validShape);
    state.shapes=clone(valid);
    sortZ();
    invalidate();UI.refreshUndo();Persist.schedule();
  },
  _touchPeer(peerId){
    if(peerId===state.peerId)return;
    const existing=state.peers.get(peerId);
    if(existing){existing.lastSeen=Date.now()}
    else{
      const colorIdx=[...state.peers.keys()].length%PEER_COLORS.length;
      state.peers.set(peerId,{color:PEER_COLORS[colorIdx],lastSeen:Date.now()});
      if(this._onConnChange)this._onConnChange();
    }
  },
  _reapPeers(){
    const now=Date.now();let changed=false;
    for(const [id,p] of state.peers){
      if(now-p.lastSeen>NET_PRESENCE_TIMEOUT){state.peers.delete(id);changed=true}
    }
    if(changed&&this._onConnChange)this._onConnChange();
  },
  peerCount(){return state.peers.size},

  // ---- WebRTC manual signaling (no server): createOffer → exchange tokens → DataChannel ----
  async wrtcCreateOffer(){
    this._wrtcInit();
    this.dc=this.rtc.createDataChannel('board',{ordered:true});
    this._wireDC();
    const offer=await this.rtc.createOffer();
    await this.rtc.setLocalDescription(offer);
    await this._wrtcGather();
    return this._encodeToken(this.rtc.localDescription);
  },
  async wrtcAcceptOffer(tokenA){
    this._wrtcInit();

    const sdp=this._decodeToken(tokenA);
    await this.rtc.setRemoteDescription(sdp);
    const answer=await this.rtc.createAnswer();
    await this.rtc.setLocalDescription(answer);
    await this._wrtcGather();
    return this._encodeToken(this.rtc.localDescription);
  },
  async wrtcConsumeAnswer(tokenB){

  },
  _wrtcInit(){
    if(this.rtc){try{this.rtc.close()}catch(_){}}

    this.rtc=new RTCPeerConnection({iceServers:[
      {urls:'stun:stun.l.google.com:19302'},
      {urls:'stun:stun1.l.google.com:19302'}

  },
  _wrtcGather(){
    return new Promise(res=>{
      if(this.rtc.iceGatheringState==='complete')return res();
      this.rtc.onicegatheringstatechange=()=>{
        if(this.rtc.iceGatheringState==='complete')res();
      };
      // safety timeout — return what we have after 3s
      setTimeout(res,3000);
    });
  },
  _wireDC(){
    this.dc.onopen=()=>{
      UI.toast(t('connected'),'ok');
      this._touchPeer('rtc:'+uid().slice(0,4));
      // send snapshot to new peer
      try{this.dc.send(JSON.stringify({k:'snapshot',shapes:clone(state.shapes),peer:state.peerId}))}catch(_){}
    };
    this.dc.onmessage=e=>{
      try{this._onRecv(JSON.parse(e.data))}catch(_){}
    };
    this.dc.onclose=()=>{UI.toast(t('disconnected'),'warn');if(this._onConnChange)this._onConnChange()};
  },
  _encodeToken(sdp){
    return btoa(unescape(encodeURIComponent(JSON.stringify({type:sdp.type,sdp:sdp.sdp}))));
  },
  _decodeToken(s){
    const j=JSON.parse(decodeURIComponent(escape(atob(s.trim()))));
    return new RTCSessionDescription(j);
  }};

// ====================== SHARE (URL hash snapshot + WebRTC UI) ======================
// Compact, dependency-free encoding. Works for any size up to ~2MB URL-safe.
const Share={
  async exportToUrl(){
    const data={v:V,shapes:state.shapes,name:state.docName};
    const json=JSON.stringify(data);
    // CompressionStream if available, else base64
    let payload=json;
    if(typeof CompressionStream!=='undefined'){
      try{
        const cs=new CompressionStream('deflate-raw');
        const w=cs.writable.getWriter();
        const blob=new Blob([json]);
        const stream=blob.stream().pipeThrough(cs);
        const buf=await new Response(stream).arrayBuffer();
        const bytes=new Uint8Array(buf);
        let bin='';for(const b of bytes)bin+=String.fromCharCode(b);
        payload='z:'+btoa(bin);
      }catch(_){payload='j:'+btoa(unescape(encodeURIComponent(json)))}
    }else{
      payload='j:'+btoa(unescape(encodeURIComponent(json)));
    }
    const url=location.origin+location.pathname+'#b='+encodeURIComponent(payload);
    return url;
  },
  async importFromHash(){
    const h=location.hash;
    if(!h.startsWith('#b='))return false;
    const enc=decodeURIComponent(h.slice(3));
    const kind=enc.slice(0,2),body=enc.slice(2);
    let json;
    try{
      if(kind==='z:'&&typeof DecompressionStream!=='undefined'){
        const bin=atob(body);
        const bytes=new Uint8Array(bin.length);
        for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
        const ds=new DecompressionStream('deflate-raw');
        const stream=new Blob([bytes]).stream().pipeThrough(ds);
        json=await new Response(stream).text();
      }else if(kind==='j:'){
        json=decodeURIComponent(escape(atob(body)));
      }else{return false}
      const data=JSON.parse(json);
      if(!Array.isArray(data.shapes))return false;
      // validate each shape — reject anything without id/type/z
      const valid=data.shapes.filter(validShape);
      if(!valid.length)return false;
      if(state.shapes.length&&!confirm(t('importConfirm')))return false;
      state.shapes=valid;state.docName=data.name||'Shared';
      sortZ();invalidate();
      document.getElementById('docName').value=state.docName;
      // clean URL
      history.replaceState(null,'',location.pathname);
      UI.toast(t('imported'),'ok');
      Persist.schedule();
      return true;
    }catch{UI.toast(t('invalidBoard'),'err');return false}
  }};
const Persist={
  db:null,
  _saveT:0,
  async open(){
    return new Promise((res,rej)=>{
      const r=indexedDB.open(DB_NAME,DB_VER);
      r.onupgradeneeded=()=>r.result.createObjectStore(DB_STORE);
      r.onsuccess=()=>{this.db=r.result;res()};
      r.onerror=()=>rej(r.error);
    });
  },
  schedule(){
    clearTimeout(this._saveT);

  },
  async save(explicit){
    if(!this.db)return;

      const tx=this.db.transaction(DB_STORE,'readwrite');
      tx.objectStore(DB_STORE).put({
        v:V,
        shapes:state.shapes,
        viewport:state.viewport,
        docName:state.docName,
        savedAt:Date.now()
      },DOC_KEY);
      await txDone(tx);
      state.dirty=false;
      state.lastSaveAt=Date.now();
      UI.refreshSaved();
      if(explicit)UI.toast(t('saved'),'ok');
    }catch(err){
      UI.toast(t('saveFailed')+': '+err.message,'err');
    }
  },
  async load(){
    if(!this.db)return;
    const tx=this.db.transaction(DB_STORE,'readonly');
    const rq=tx.objectStore(DB_STORE).get(DOC_KEY);
    const d=await reqDone(rq);
    if(d&&Array.isArray(d.shapes)){
      // Validate like the other intake paths (importFromHash / snapshot): never
      // adopt malformed shapes from IDB (corruption / forward-incompat schema).
      state.shapes=d.shapes.filter(validShape);
      if(d.viewport&&Number.isFinite(+d.viewport.x)&&Number.isFinite(+d.viewport.y)&&Number.isFinite(+d.viewport.zoom)&&d.viewport.zoom>0)Object.assign(state.viewport,d.viewport);
      if(d.docName){state.docName=d.docName;document.getElementById('docName').value=d.docName}
      state.lastSaveAt=d.savedAt||0;
      sortZ();
    }
  }};
function txDone(tx){return new Promise((r,j)=>{tx.oncomplete=()=>r();tx.onerror=()=>j(tx.error);tx.onabort=()=>j(tx.error)})}

window.addEventListener('beforeunload',e=>{
  if(state.dirty){Persist.save();e.preventDefault();e.returnValue=''}
});

function applyStyleToSelection(patch){
  if(!state.selection.size)return;
  const before=[],after=[];
  for(const id of state.selection){
    const sh=byId(id);if(!sh)continue;
    const b={id},a={id};
    for(const k of Object.keys(patch)){b[k]=sh[k];a[k]=patch[k]}
    Object.assign(sh,patch);
    before.push(b);after.push(a);
  }
  if(before.length)Store._recordCommitted({op:'style',before,after});
  invalidate();
}
// Slider undo coalescing: capture shape prop values on pointerdown, flush a single
// style op on change. Multiple input events during a drag never hit the undo stack.
const _sbf={};
function _sfbCapture(p){for(const id of state.selection){const s=byId(id);if(s)_sbf[id+p]=s[p]}}
function _sfbFlush(p,v){const b=[],a=[];for(const id of state.selection){const k=id+p;if(k in _sbf){b.push({id,[p]:_sbf[k]});a.push({id,[p]:v});delete _sbf[k]}}if(b.length&&b.some(x=>x[p]!==v))Store._recordCommitted({op:'style',before:b,after:a});}

function copyStyle(){
  // Copy style from the first selected shape
  const ids=[...state.selection];
  const sh=ids.length?byId(ids[0]):null;
  if(!sh){UI.toast(t('noSelection'),'warn');return}
  state.styleClipboard={
    stroke:sh.stroke,fill:sh.fill,
    size:sh.size,opacity:sh.opacity,dash:sh.dash||0
  };
  UI.toast(t('styleCopied'),'ok');
}
function pasteStyle(){
  if(!state.styleClipboard||!state.selection.size){return}
  // Remove undefined keys
  const patch=Object.fromEntries(
    Object.entries(state.styleClipboard).filter(([,v])=>v!==undefined)
  );
  applyStyleToSelection(patch);
  UI.toast(t('stylePasted'),'ok');
}

const Presentation=(()=>{
  let _active=false;
  let _frames=[];
  let _idx=0;
  let _overlay=null;
  let _savedVp=null;   // viewport before entering, restored on leave

  function _getFrames(){
    return [...state.shapes]
      .filter(s=>s.type==='frame')
      .sort((a,b)=>a.x-b.x||(a.y-b.y));  // left→right, then top→bottom
  }

  function _zoomToFrame(frame,anim){
    const vW=window.innerWidth,vH=window.innerHeight;
    const pad=40;
    const scaleX=(vW-pad*2)/frame.w;
    const scaleY=(vH-pad*2)/frame.h;
    const zoom=Math.min(scaleX,scaleY,4);
    const cx=frame.x+frame.w/2;
    const cy=frame.y+frame.h/2;
    state.viewport.zoom=zoom;
    state.viewport.x=cx-vW/(2*zoom);
    state.viewport.y=cy-vH/(2*zoom);
    UI.refreshZoom();
    invalidate();
  }

  function enter(){
    _frames=_getFrames();
    if(!_frames.length){UI.toast(t('noFrames'),'warn');return}
    _active=true;_idx=0;
    _savedVp={x:state.viewport.x,y:state.viewport.y,zoom:state.viewport.zoom};
    // Build overlay
    _overlay=document.createElement('div');
    _overlay.id='presOverlay';
    _overlay.style.cssText='position:fixed;inset:0;z-index:9000;background:#000;display:flex;flex-direction:column;';
    // Counter
    const counter=document.createElement('div');
    counter.id='presCounter';
    counter.style.cssText='position:absolute;bottom:16px;left:50%;transform:translateX(-50%);color:#fff;font-size:13px;font-family:system-ui;opacity:.7;pointer-events:none;';
    _overlay.appendChild(counter);
    // Exit button
    const exit=document.createElement('button');
    exit.textContent='✕ Esc';
    exit.style.cssText='position:absolute;top:12px;right:16px;background:rgba(255,255,255,.15);border:none;color:#fff;padding:6px 12px;border-radius:4px;cursor:pointer;font-size:13px;';
    exit.onclick=leave;
    _overlay.appendChild(exit);
    // Canvas passthrough: hide the overlay visually and let canvas show
    _overlay.style.pointerEvents='none';  // clicks pass through to canvas
    exit.style.pointerEvents='auto';
    document.body.appendChild(_overlay);
    // Hide UI chrome
    document.querySelector('.toolbar').style.display='none';
    document.querySelector('.topbar').style.display='none';
    document.querySelector('.statusbar').style.display='none';
    document.querySelector('.minimap-wrap')?.style.setProperty('display','none');
    canvas.style.position='fixed';canvas.style.inset='0';canvas.style.zIndex='8999';
    _goto(0);
  }

  function leave(){
    if(!_active)return;
    _laser=null;_active=false;
    _overlay?.remove();_overlay=null;
    canvas.style.position='';canvas.style.inset='';canvas.style.zIndex='';
    document.querySelector('.toolbar').style.display='';
    document.querySelector('.topbar').style.display='';
    document.querySelector('.statusbar').style.display='';
    document.querySelector('.minimap-wrap')?.style.removeProperty('display');
    if(_savedVp){Object.assign(state.viewport,_savedVp);_savedVp=null;UI.refreshZoom()}
    invalidate();
  }

  function _goto(i){
    _idx=Math.max(0,Math.min(_frames.length-1,i));
    _zoomToFrame(_frames[_idx]);
    const c=document.getElementById('presCounter');
    if(c)c.textContent=`${_idx+1} / ${_frames.length}`;
  }

  function next(){if(_active&&_idx<_frames.length-1)_goto(_idx+1)}
  function prev(){if(_active&&_idx>0)_goto(_idx-1)}
  function isActive(){return _active}

  return{enter,leave,next,prev,isActive};
})();
const Minimap=(()=>{
  const mc=document.getElementById('minimap');
  if(!mc)return{draw(){}};
  const mx=mc.getContext('2d');
  const W=160,H=100;
  let _raf=0;

  function draw(){
    _raf=0;
    const shapes=state.shapes;
    mx.clearRect(0,0,W,H);
    if(!shapes.length)return;
    const bb=G.bboxAll(shapes);
    if(!bb)return;
    const pad=20;
    const scX=W/(bb.w+pad*2),scY=H/(bb.h+pad*2);
    const sc=Math.min(scX,scY,1);
    const ox=-bb.x*sc+(W-bb.w*sc)/2;
    const oy=-bb.y*sc+(H-bb.h*sc)/2;
    for(const s of shapes){
      if(!s||s.opacity===0)continue;
      mx.globalAlpha=(s.opacity??1)*0.8;
      mx.fillStyle=s.fill||'transparent';
      mx.strokeStyle=s.stroke||getCSS('--ink');
      mx.lineWidth=Math.max(0.5,(s.size||1)*sc);
      const _mr=s.rotate&&s.w!=null;
      if(_mr){const ccx=(s.x+s.w/2)*sc+ox,ccy=(s.y+s.h/2)*sc+oy;mx.save();mx.translate(ccx,ccy);mx.rotate(s.rotate*Math.PI/180);mx.translate(-ccx,-ccy);}
      switch(s.type){
        case 'rect':{const rx=s.x*sc+ox,ry=s.y*sc+oy,rw=s.w*sc,rh=s.h*sc;if(s.fill)mx.fillRect(rx,ry,rw,rh);mx.strokeRect(rx,ry,rw,rh);break}
        case 'ellipse':mx.beginPath();mx.ellipse(s.x*sc+ox+s.w*sc/2,s.y*sc+oy+s.h*sc/2,Math.abs(s.w*sc/2),Math.abs(s.h*sc/2),0,0,Math.PI*2);if(s.fill)mx.fill();mx.stroke();break;
        case 'line':case 'arrow':{const me=connEnds(s);mx.beginPath();mx.moveTo(me.x1*sc+ox,me.y1*sc+oy);mx.lineTo(me.x2*sc+ox,me.y2*sc+oy);mx.stroke();break}
        case 'pen':if(s.pts.length<2)break;mx.beginPath();mx.moveTo(s.pts[0][0]*sc+ox,s.pts[0][1]*sc+oy);for(let i=1;i<s.pts.length;i++)mx.lineTo(s.pts[i][0]*sc+ox,s.pts[i][1]*sc+oy);mx.stroke();break;
        case 'text':case 'sticky':{const rx2=s.x*sc+ox,ry2=s.y*sc+oy,rw2=Math.max(2,s.w*sc),rh2=Math.max(2,s.h*sc);mx.fillStyle=s.type==='sticky'?(s.color||'#FEF08A'):(s.fill||getCSS('--brand'));mx.fillRect(rx2,ry2,rw2,rh2);break}
        case 'image':{const rx3=s.x*sc+ox,ry3=s.y*sc+oy,rw3=Math.max(2,s.w*sc),rh3=Math.max(2,s.h*sc);const img=_imgCache.get(s.dataUrl);if(img&&img.complete&&img.naturalWidth)mx.drawImage(img,rx3,ry3,rw3,rh3);else{mx.fillStyle='#CBD5E1';mx.fillRect(rx3,ry3,rw3,rh3)}break}
      }
      if(_mr)mx.restore();
    }
    mx.globalAlpha=1;
    const vp=state.viewport,cW=window.innerWidth,cH=window.innerHeight;
    const vx=vp.x*sc+ox,vy=vp.y*sc+oy,vw=(cW/vp.zoom)*sc,vh=(cH/vp.zoom)*sc;
    mx.strokeStyle=getCSS('--brand');mx.lineWidth=1.5;mx.setLineDash([3,2]);
    mx.strokeRect(vx,vy,vw,vh);mx.setLineDash([]);
  }

  function schedule(){if(!_raf)_raf=requestAnimationFrame(draw)}

  mc.addEventListener('click',e=>{
    const r=mc.getBoundingClientRect();
    const mx2=(e.clientX-r.left)/r.width,my2=(e.clientY-r.top)/r.height;
    const shapes=state.shapes;const bb=G.bboxAll(shapes);if(!bb)return;
    const pad=20,sc=Math.min(W/(bb.w+pad*2),H/(bb.h+pad*2),1);
    const ox=-bb.x*sc+(W-bb.w*sc)/2,oy=-bb.y*sc+(H-bb.h*sc)/2;
    const wx=(mc.width*mx2-ox)/sc,wy=(mc.height*my2-oy)/sc;
    state.viewport.x=wx-window.innerWidth/state.viewport.zoom/2;
    state.viewport.y=wy-window.innerHeight/state.viewport.zoom/2;
    invalidate();
  });

  return{draw,schedule};
})();

        const r=await c.match(e.request);

        try{const n=await fetch(e.request);if(e.request.method==='GET')c.put(e.request,n.clone());return n}
        catch(_){return new Response('offline',{status:503})}
      }));
    });`;
  const bl=new Blob([sw],{type:'text/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(bl)).catch(()=>{});
}
</script>
