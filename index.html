    b.addEventListener('click',()=>pickTool(b.dataset.tool));
  // topbar
  document.getElementById('btnUndo').onclick=()=>Store.undo()&&UI.toast(t('undone'));
  document.getElementById('btnRedo').onclick=()=>Store.redo()&&UI.toast(t('redone'));
  document.getElementById('btnExport').onclick=exportPNG;
  document.getElementById('btnPresent').onclick=()=>Presentation.enter();
  // doc name
  const docNameEl=document.getElementById('docName');
  if(docNameEl){
    docNameEl.value=state.docName||'Untitled';
    // IME-safe live update. During Japanese (etc.) composition, `input` fires for
    // each unconfirmed update, and on Safari `input` also fires twice on commit
    // (Qiita: Rapls / Zenn: spacemarket). imeShouldCommit() returns false for
    // mid-composition input events to keep partial conversions out of state/IDB/sync;
    // a parallel compositionend listener picks up the final value once IME confirms.
    const _commitDocName=()=>{state.docName=docNameEl.value;_syncDocTitle();state.dirty=true;Persist.schedule()};
    docNameEl.addEventListener('input',e=>{if(imeShouldCommit(e))_commitDocName()});
    docNameEl.addEventListener('compositionend',_commitDocName);
    docNameEl.addEventListener('change',()=>{state.docName=docNameEl.value||'Untitled';_syncDocTitle();Persist.schedule()});
  }
  document.getElementById('btnInstall').onclick=_onBtnInstall;
  document.getElementById('btnHelp').onclick=()=>UI.toggleHelp();
  document.getElementById('helpClose').onclick=()=>UI.toggleHelp();
  document.getElementById('help').addEventListener('click',e=>{
    if(e.target.id==='help')UI.toggleHelp();
  });
  // swatches
  for(const b of document.querySelectorAll('[data-stroke]'))
    b.addEventListener('click',()=>{
      state.style.stroke=b.dataset.stroke;
      for(const x of document.querySelectorAll('[data-stroke]'))x.setAttribute('aria-pressed',x===b);
      // apply to selection
      if(state.selection.size)applyStyleToSelection({stroke:state.style.stroke});
    });
  for(const b of document.querySelectorAll('[data-fill]'))
    b.addEventListener('click',()=>{
      state.style.fill=b.dataset.fill==='null'?null:b.dataset.fill;
      for(const x of document.querySelectorAll('[data-fill]'))x.setAttribute('aria-pressed',x===b);
      if(state.selection.size)applyStyleToSelection({fill:state.style.fill});
    });
  for(const b of document.querySelectorAll('[data-dash]'))
    b.addEventListener('click',()=>{
      state.style.dash=+b.dataset.dash;
      for(const x of document.querySelectorAll('[data-dash]'))x.setAttribute('aria-pressed',x===b);
      if(state.selection.size)applyStyleToSelection({dash:state.style.dash});
    });
  // Native <input type=color> fires `input` continuously while the picker is open, so
  // committing per-input would stack dozens of undo steps and sync broadcasts for one
  // colour pick. Coalesce exactly like the size/opacity sliders: snapshot on open, live-
  // preview on input (no Store), flush ONE style op on change.
  for(const cp of document.querySelectorAll('input.cp')){
    const k=cp.dataset.cp;   // 'stroke' or 'fill'
    cp.addEventListener('focus',()=>_sfbCapture(k));
    cp.addEventListener('pointerdown',()=>_sfbCapture(k));
    cp.addEventListener('input',()=>{
      state.style[k]=cp.value;
      for(const x of document.querySelectorAll('[data-'+k+']'))x.setAttribute('aria-pressed',x===cp);
      for(const id of state.selection){const s=byId(id);if(s)s[k]=cp.value}
      if(state.selection.size)invalidate();
    });
    cp.addEventListener('change',()=>{_sfbFlush(k,cp.value);_sfbCapture(k);});
  }
  const rng=document.getElementById('rngSize');
  const opacRng=document.getElementById('rngOpacity');
  const opacVal=document.getElementById('opacVal');
  rng.addEventListener('focus',()=>_sfbCapture('size'));
  rng.addEventListener('pointerdown',()=>_sfbCapture('size'));
  rng.addEventListener('input',()=>{
    state.style.size=+rng.value;
    document.getElementById('sizeVal').textContent=rng.value;
    for(const id of state.selection){const s=byId(id);if(s)s.size=state.style.size}
    if(state.selection.size)invalidate();
  });
  rng.addEventListener('change',()=>{_sfbFlush('size',state.style.size);_sfbCapture('size');});
  if(opacRng){
    opacRng.addEventListener('focus',()=>_sfbCapture('opacity'));
    opacRng.addEventListener('pointerdown',()=>_sfbCapture('opacity'));
    opacRng.addEventListener('input',()=>{
      const v=+opacRng.value/100;
      state.style.opacity=v;
      if(opacVal)opacVal.textContent=opacRng.value;
      for(const id of state.selection){const s=byId(id);if(s)s.opacity=v}
      if(state.selection.size)invalidate();
    });
    opacRng.addEventListener('change',()=>{_sfbFlush('opacity',state.style.opacity);_sfbCapture('opacity');});
  }
  // zoom
  document.getElementById('btnZoomIn').onclick=()=>zoomBy(1.2);
  document.getElementById('btnZoomOut').onclick=()=>zoomBy(1/1.2);
  document.getElementById('btnFit').onclick=fitToContent;
  document.getElementById('zoomVal').onclick=zoomReset;
  // online
  window.addEventListener('online',UI.updateOnline);
  window.addEventListener('offline',UI.updateOnline);
  // PWA install button (v1.6.92): show when browser signals installability; hide after install.
  // `beforeinstallprompt` fires on Chrome/Edge/Samsung Internet when all install criteria are
  // met. Safari/Firefox do not fire it — the button stays hidden there (progressive enhancement).
  // We call e.preventDefault() to suppress the browser's ambient mini-infobar prompt so that
  // install is fully user-initiated via our button. Ref: web.dev/customize-install/
  window.addEventListener('beforeinstallprompt',e=>{
    e.preventDefault();
    _installPrompt=e;
    const btn=document.getElementById('btnInstall');
    if(btn)btn.hidden=false;
  });
  window.addEventListener('appinstalled',()=>{
    _installPrompt=null;
    const btn=document.getElementById('btnInstall');
    if(btn)btn.hidden=true;
  });
  // resize
  window.addEventListener('resize',resize);
  // devicePixelRatio change (window dragged to a different-density monitor) fires no resize
  _watchDPR();
  // some Android devices fire orientationchange separately from resize
  if('orientation' in screen)screen.orientation.addEventListener('change',resize);
  // theme / high-contrast switches change design-token values → drop getCSS cache
  if(window.matchMedia)for(const q of ['(prefers-color-scheme:dark)','(forced-colors:active)','(prefers-contrast:more)']){
    try{matchMedia(q).addEventListener('change',clearCSSCache)}catch(_){}
  }
  // close ctx on click outside
  document.addEventListener('mousedown',e=>{
    if(!e.target.closest('.ctx-menu'))UI.closeCtxMenu();
  });
  // v1.6.95: Arrow-key navigation inside the context menu (ARIA APG menu pattern)
  document.getElementById('ctx').addEventListener('keydown',e=>_ctxMenuKeyNav(document.getElementById('ctx'),e));
  // Initial tool styling
  pickTool('select');
  // periodic saved-ago refresh
  setInterval(UI.refreshSaved,5000);

  // ---- Share / Net (v1.1) ----
  document.getElementById('btnShare').onclick=()=>UI.openShare();
  document.getElementById('shareClose').onclick=()=>UI.closeShare();
  document.getElementById('share').addEventListener('click',e=>{
    if(e.target.id==='share')UI.closeShare();
  });
  document.getElementById('shareCopyBtn').onclick=async()=>{
    const url=document.getElementById('shareUrl').value;
    if(url){const ok=await copyText(url);UI.toast(ok?t('shareUrlCopied'):t('copyFailed'),ok?'ok':'warn')}
  };
  // WebRTC manual signaling
  {const _g=id=>document.getElementById(id);
  _g('rtcCreateOffer').onclick=async()=>{try{_g('rtcOffer').value=await Net.wrtcCreateOffer()}catch(e){UI.toast(String(e),'err')}};
  _g('rtcConnect').onclick=async()=>{const a=_g('rtcAnswerIn').value.trim();if(!a)return;try{await Net.wrtcConsumeAnswer(a);UI.toast(t('connected'),'ok')}catch(e){UI.toast(String(e),'err')}};
  _g('rtcCreateAnswer').onclick=async()=>{const o=_g('rtcOfferIn').value.trim();if(!o)return;try{_g('rtcAnswer').value=await Net.wrtcAcceptOffer(o)}catch(e){UI.toast(String(e),'err')}};
  }
  // Net presence → UI
  Net._onConnChange=()=>UI.refreshPeers();
}
function applyStyleToSelection(patch){
  if(!state.selection.size)return;
  const before=[],after=[];
  for(const id of state.selection){
    const sh=byId(id);if(!sh)continue;
    const b={id},a={id};
    for(const k of Object.keys(patch)){b[k]=sh[k];a[k]=patch[k]}
    Object.assign(sh,patch);
    before.push(b);after.push(a);
  }
  if(before.length)Store._recordCommitted({op:'style',before,after});
  invalidate();
}
// Slider undo coalescing: capture shape prop values on pointerdown, flush a single
// style op on change. Multiple input events during a drag never hit the undo stack.
const _sbf={};
function _sfbCapture(p){for(const id of state.selection){const s=byId(id);if(s&&!(id+p in _sbf))_sbf[id+p]=s[p]}}
function _sfbFlush(p,v){const b=[],a=[];for(const id of state.selection){const k=id+p;if(k in _sbf){b.push({id,[p]:_sbf[k]});a.push({id,[p]:v});delete _sbf[k]}}if(b.length&&b.some(x=>x[p]!==v))Store._recordCommitted({op:'style',before:b,after:a});}

function copyStyle(){
  // Copy style from the first selected shape
  const ids=[...state.selection];
  const sh=ids.length?byId(ids[0]):null;
  if(!sh){UI.toast(t('noSelection'),'warn');return}
  state.styleClipboard={
    stroke:sh.stroke,fill:sh.fill,
    size:sh.size,opacity:sh.opacity,dash:sh.dash||0
  };
  UI.toast(t('styleCopied'),'ok');
}
function pasteStyle(){
  if(!state.styleClipboard||!state.selection.size){return}
  // Remove undefined keys
  const patch=Object.fromEntries(
    Object.entries(state.styleClipboard).filter(([,v])=>v!==undefined)
  );
  applyStyleToSelection(patch);
  UI.toast(t('stylePasted'),'ok');
}

// ====================== PRESENTATION MODE ======================
const Presentation=(()=>{
  let _active=false;
  let _frames=[];
  let _idx=0;
  let _overlay=null;
  let _savedVp=null;   // viewport before entering, restored on leave
  let _focusTrigger=null;  // element to restore focus to on leave (WCAG SC 2.4.3)
  // v1.6.90: Screen Wake Lock — prevent the display from sleeping mid-presentation.
  // Zenn/Qiita: "プレゼンテーション中にスクリーンがオフになる問題" / Screen Wake Lock API.
  // Silent best-effort; browsers that don't support it (Safari < 16.4) simply skip.
  // The browser auto-releases the lock when the tab goes to the background (visibilitychange
  // → hidden), so we re-acquire it when the tab becomes visible again.
  let _wakeLock=null;
  async function _acquireWakeLock(){
    if(!navigator.wakeLock)return;
    try{_wakeLock=await navigator.wakeLock.request('screen')}catch(_){}
  }
  function _releaseWakeLock(){
    if(_wakeLock){_wakeLock.release().catch(()=>{});_wakeLock=null;}
  }
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible'&&_active)_acquireWakeLock();
  });

  function _getFrames(){
    return [...state.shapes]
      .filter(s=>s.type==='frame')
      .sort((a,b)=>a.x-b.x||(a.y-b.y));  // left→right, then top→bottom
  }

  function _zoomToFrame(frame,anim){
    const vW=window.innerWidth,vH=window.innerHeight;
    const pad=40;
    const scaleX=(vW-pad*2)/frame.w;
    const scaleY=(vH-pad*2)/frame.h;
    const zoom=Math.min(scaleX,scaleY,4);
    const cx=frame.x+frame.w/2;
    const cy=frame.y+frame.h/2;
    state.viewport.zoom=zoom;
    state.viewport.x=cx-vW/(2*zoom);
    state.viewport.y=cy-vH/(2*zoom);
    UI.refreshZoom();
    invalidate();
  }

  function enter(){
    _frames=_getFrames();
    if(!_frames.length){UI.toast(t('noFrames'),'warn');return}
    _focusTrigger=document.activeElement;
    _active=true;_idx=0;
    _savedVp={x:state.viewport.x,y:state.viewport.y,zoom:state.viewport.zoom};
    // Build overlay
    _overlay=document.createElement('div');
    _overlay.id='presOverlay';
    _overlay.style.cssText='position:fixed;inset:0;z-index:9000;background:#000;display:flex;flex-direction:column;';
    // Counter
    const counter=document.createElement('div');
    counter.id='presCounter';
    counter.style.cssText='position:absolute;bottom:16px;left:50%;transform:translateX(-50%);color:#fff;font-size:13px;font-family:system-ui;opacity:.7;pointer-events:none;';
    _overlay.appendChild(counter);
    // Exit button
    const exit=document.createElement('button');
    exit.textContent='✕ Esc';
    exit.style.cssText='position:absolute;top:12px;right:16px;background:rgba(255,255,255,.15);border:none;color:#fff;padding:6px 12px;border-radius:4px;cursor:pointer;font-size:13px;';
    exit.onclick=leave;
    _overlay.appendChild(exit);
    // Canvas passthrough: hide the overlay visually and let canvas show
    _overlay.style.pointerEvents='none';  // clicks pass through to canvas
    exit.style.pointerEvents='auto';
    document.body.appendChild(_overlay);
    // Hide UI chrome
    document.querySelector('.toolbar').style.display='none';
    document.querySelector('.topbar').style.display='none';
    document.querySelector('.statusbar').style.display='none';
    document.querySelector('.minimap-wrap')?.style.setProperty('display','none');
    canvas.style.position='fixed';canvas.style.inset='0';canvas.style.zIndex='8999';
    _goto(0);
    _acquireWakeLock();
  }

  function leave(){
    if(!_active)return;
    _laser=null;_active=false;
    _releaseWakeLock();
    _overlay?.remove();_overlay=null;
    canvas.style.position='';canvas.style.inset='';canvas.style.zIndex='';
    document.querySelector('.toolbar').style.display='';
    document.querySelector('.topbar').style.display='';
    document.querySelector('.statusbar').style.display='';
    document.querySelector('.minimap-wrap')?.style.removeProperty('display');
    if(_savedVp){Object.assign(state.viewport,_savedVp);_savedVp=null;UI.refreshZoom()}
    invalidate();
    _focusTrigger?.focus();_focusTrigger=null;
  }

  function _goto(i){
    _idx=Math.max(0,Math.min(_frames.length-1,i));
    _zoomToFrame(_frames[_idx]);
    const c=document.getElementById('presCounter');
    if(c)c.textContent=`${_idx+1} / ${_frames.length}`;
  }

  function next(){if(_active&&_idx<_frames.length-1)_goto(_idx+1)}
  function prev(){if(_active&&_idx>0)_goto(_idx-1)}
  function isActive(){return _active}

  return{enter,leave,next,prev,isActive,_acquireWakeLock,_releaseWakeLock,
    _setTestState:(active,trigger)=>{_active=active;_focusTrigger=trigger;}};
})();
const Minimap=(()=>{
  const mc=document.getElementById('minimap');
  if(!mc)return{draw(){}};
  const mx=mc.getContext('2d');
  const W=160,H=100;
  let _raf=0;

  function draw(){
    _raf=0;
    const shapes=state.shapes;
    mx.clearRect(0,0,W,H);
    if(!shapes.length)return;
    const bb=G.bboxAll(shapes);
    if(!bb)return;
    const pad=20;
    const scX=W/(bb.w+pad*2),scY=H/(bb.h+pad*2);
    const sc=Math.min(scX,scY,1);
    const ox=-bb.x*sc+(W-bb.w*sc)/2;
    const oy=-bb.y*sc+(H-bb.h*sc)/2;
    for(const s of shapes){
      if(!s||s.opacity===0)continue;
      mx.globalAlpha=(s.opacity??1)*0.8;
      mx.fillStyle=s.fill||'transparent';
      mx.strokeStyle=s.stroke||getCSS('--ink');
      mx.lineWidth=Math.max(0.5,(s.size||1)*sc);
      const _mr=s.rotate&&s.w!=null;
      if(_mr){const ccx=(s.x+s.w/2)*sc+ox,ccy=(s.y+s.h/2)*sc+oy;mx.save();mx.translate(ccx,ccy);mx.rotate(s.rotate*Math.PI/180);mx.translate(-ccx,-ccy);}
      switch(s.type){
        case 'frame':
        case 'rect':{const rx=s.x*sc+ox,ry=s.y*sc+oy,rw=s.w*sc,rh=s.h*sc;if(s.fill)mx.fillRect(rx,ry,rw,rh);mx.strokeRect(rx,ry,rw,rh);break}
        case 'ellipse':mx.beginPath();mx.ellipse(s.x*sc+ox+s.w*sc/2,s.y*sc+oy+s.h*sc/2,Math.abs(s.w*sc/2),Math.abs(s.h*sc/2),0,0,Math.PI*2);if(s.fill)mx.fill();mx.stroke();break;
        case 'line':case 'arrow':{const me=connEnds(s);mx.beginPath();mx.moveTo(me.x1*sc+ox,me.y1*sc+oy);mx.lineTo(me.x2*sc+ox,me.y2*sc+oy);mx.stroke();break}
        case 'pen':if(s.pts.length<2)break;mx.beginPath();mx.moveTo(s.pts[0][0]*sc+ox,s.pts[0][1]*sc+oy);for(let i=1;i<s.pts.length;i++)mx.lineTo(s.pts[i][0]*sc+ox,s.pts[i][1]*sc+oy);mx.stroke();break;
        case 'text':case 'sticky':{const rx2=s.x*sc+ox,ry2=s.y*sc+oy,rw2=Math.max(2,s.w*sc),rh2=Math.max(2,s.h*sc);mx.fillStyle=s.type==='sticky'?(s.color||'#FEF08A'):(s.fill||getCSS('--brand'));mx.fillRect(rx2,ry2,rw2,rh2);break}
        case 'image':{const rx3=s.x*sc+ox,ry3=s.y*sc+oy,rw3=Math.max(2,s.w*sc),rh3=Math.max(2,s.h*sc);const img=_imgCache.get(s.dataUrl);if(img&&img.complete&&img.naturalWidth)mx.drawImage(img,rx3,ry3,rw3,rh3);else{mx.fillStyle='#CBD5E1';mx.fillRect(rx3,ry3,rw3,rh3)}break}
      }
      if(_mr)mx.restore();
    }
    mx.globalAlpha=1;
    const vp=state.viewport,cW=window.innerWidth,cH=window.innerHeight;
    const vx=vp.x*sc+ox,vy=vp.y*sc+oy,vw=(cW/vp.zoom)*sc,vh=(cH/vp.zoom)*sc;
    mx.strokeStyle=getCSS('--brand');mx.lineWidth=1.5;mx.setLineDash([3,2]);
    mx.strokeRect(vx,vy,vw,vh);mx.setLineDash([]);
  }

  function schedule(){if(!_raf)_raf=requestAnimationFrame(draw)}

  mc.addEventListener('click',e=>{
    const r=mc.getBoundingClientRect();
    const mx2=(e.clientX-r.left)/r.width,my2=(e.clientY-r.top)/r.height;
    const shapes=state.shapes;const bb=G.bboxAll(shapes);if(!bb)return;
    const pad=20,sc=Math.min(W/(bb.w+pad*2),H/(bb.h+pad*2),1);
    const ox=-bb.x*sc+(W-bb.w*sc)/2,oy=-bb.y*sc+(H-bb.h*sc)/2;
    const wx=(mc.width*mx2-ox)/sc,wy=(mc.height*my2-oy)/sc;
    state.viewport.x=wx-window.innerWidth/state.viewport.zoom/2;
    state.viewport.y=wy-window.innerHeight/state.viewport.zoom/2;
    invalidate();
  });

  return{draw,schedule};
})();

// ====================== MAIN ======================
(async function main(){
  wire();
  UI.fillHelp();
  UI.applyI18n();
  UI.updateOnline();
  resize();
  try{await Persist.open();await Persist.load()}catch(err){console.warn('persist init',err)}
  UI.refreshUndo();UI.refreshZoom();UI.refreshSaved();
  // version display
  document.getElementById('sVer').textContent='v'+V;
  // v1.1: import shared board from URL hash (if any)
  try{await Share.importFromHash()}catch(_){}
  // v1.1: start BroadcastChannel sync for same-browser tab sync
  Net.init();
  UI.refreshPeers();
  _rafId=requestAnimationFrame(frame);
})();

// ====================== SERVICE WORKER (inline) ======================
// Named handler exported for tests — avoids closure-identity issues with UI.toast mocking.
function _onSwUpdate(){ UI.toast(t('appUpdated'),'ok'); }
// offline-first caching of this single page
if('serviceWorker' in navigator){
  const sw=`
    const C='board-v${V}';
    self.addEventListener('install',e=>{self.skipWaiting()});
    self.addEventListener('activate',e=>{e.waitUntil((async()=>{
      for(const k of await caches.keys())if(k!==C)await caches.delete(k);
      await clients.claim();
    })())});
    self.addEventListener('fetch',e=>{
      e.respondWith(caches.open(C).then(async c=>{
        const r=await c.match(e.request);
        if(r)return r;
        try{const n=await fetch(e.request);if(e.request.method==='GET')c.put(e.request,n.clone());return n}
        catch(_){return new Response('offline',{status:503})}
      }));
    });`;
  const bl=new Blob([sw],{type:'text/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(bl)).catch(()=>{});
  // v1.6.93: SW update notification. skipWaiting()+clients.claim() in the SW means a
  // new version activates immediately, but the page gets no feedback. Listen for
  // controllerchange (fires when a new SW takes over) and prompt a reload.
  // Pattern: web.dev/service-worker-lifecycle / Zenn「SW更新時にリロードを促す」.
  navigator.serviceWorker.addEventListener('controllerchange',_onSwUpdate);
}
